name: Verify Prototypes

on:
  pull_request:
    paths:
      - 'prototypes/**'
  push:
    branches:
      - main
      - develop
    paths:
      - 'prototypes/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para git diff

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run tests
        run: cd packages/autorun-core && npm run test

      - name: Verify prototypes
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref || 'main' }}"
          else
            BASE_REF="origin/main"
          fi
          npm run prototypes:verify -- --base=$BASE_REF
        env:
          CI: true
        continue-on-error: false

