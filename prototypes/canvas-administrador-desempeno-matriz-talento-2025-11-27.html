    <style>
        /* ========================================
           GLOBAL STYLES
           ======================================== */
        
        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--ubits-bg-2);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overflow-y: auto;
            font-family: var(--font-sans, 'Noto Sans', sans-serif);
            scrollbar-width: thin;
            scrollbar-color: var(--ubits-fg-2-medium-static) var(--ubits-bg-5);
        }

        /* Scrollbar personalizado */
        ::-webkit-scrollbar {
            width: var(--ubits-spacing-sm, 8px);
        }

        ::-webkit-scrollbar-track {
            background: var(--ubits-bg-5);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--ubits-fg-2-medium-static);
            border-radius: var(--ubits-border-radius-xs, 4px);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--ubits-fg-2-high-static);
        }

        /* ========================================
           DASHBOARD CONTAINER
           ======================================== */
        
        .dashboard-container {
            display: flex;
            min-height: 100vh;
            width: 100%;
            overflow: visible;
            /* ⚠️ IMPORTANTE: NO usar justify-content: center aquí */
            /* El margin: auto en .main-content (≥1440px) se encarga del centrado */
        }

        /* ========================================
           TOOLTIP
           ======================================== */
        
        /* ⚠️ NOTA: Los estilos del tooltip del sidebar están en el componente sidebar.css */
        /* No sobrescribir aquí, usar los estilos del componente oficial */

        /* ========================================
           MAIN CONTENT
           ======================================== */
        
        .main-content {
            position: relative;
            flex: 1;
            margin: var(--ubits-spacing-lg, 16px) var(--ubits-spacing-2xl, 24px) 0 calc(var(--ubits-spacing-2xl, 24px) + 96px + 23px);
            width: calc(100% - calc(var(--ubits-spacing-2xl, 24px) + 96px + 23px) - var(--ubits-spacing-2xl, 24px));
            overflow: visible;
            max-height: none;
            display: flex;
            flex-direction: column;
            gap: var(--ubits-spacing-xl, 20px); /* Gap entre SubNav y Content Area */
            z-index: 5;
            box-sizing: border-box;
        }

        /* Centrado para pantallas grandes - EXACTAMENTE igual que el proyecto UBITS original */
        /* El proyecto UBITS original usa margin: auto sin cambiar flex */
        @media (min-width: 1440px) {
            .main-content {
                margin: var(--ubits-spacing-lg, 16px) auto 0 auto; /* ⚠️ margin auto centra el elemento */
                padding-left: calc(var(--ubits-spacing-2xl, 24px) + 96px + 23px); /* Espacio para sidebar (24px + 96px + 23px gap) */
                padding-right: var(--ubits-spacing-2xl, 24px);
                width: 1607px;
                max-width: 1607px;
                box-sizing: border-box;
                /* ⚠️ IMPORTANTE: Mantener flex: 1, igual que el proyecto UBITS original */
                /* NO cambiar a flex: none, el margin: auto funciona con flex: 1 */
            }
        }

        /* Ajustar gap en móvil cuando no hay subnav - igual que el proyecto UBITS original */
        @media (max-width: 1023px) {
            /* ⚠️ CRÍTICO: Ocultar sidebar container, igual que el proyecto UBITS original */
            #sidebar-container {
                display: none !important;
            }
            
            .main-content {
                gap: var(--ubits-spacing-xl, 20px);
                margin: var(--ubits-spacing-lg, 16px) var(--ubits-spacing-md, 12px) 0 var(--ubits-spacing-md, 12px) !important;
                width: calc(100% - var(--ubits-spacing-2xl, 24px));
                padding-left: 0;
                padding-right: 0;
                max-width: 100%;
                padding-bottom: var(--ubits-spacing-6xl, 40px); /* Espacio para el TabBar, igual que el proyecto UBITS original */
            }
            
            .content-area {
                padding-bottom: var(--ubits-spacing-6xl, 40px); /* Espacio para el TabBar, igual que el proyecto UBITS original */
            }
            
            .main-content > *:first-child {
                margin-top: calc(-1 * var(--ubits-spacing-xl, 20px));
            }
        }

        /* ========================================
           TOP NAV CONTAINER (SubNav)
           ======================================== */

        /* El SubNav debe mantener sus estilos originales del componente */
        /* Solo establecer el contenedor para que el componente SubNav funcione correctamente */

            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        /* ========================================
           SUB NAV CONTAINER
           ======================================== */
        
        #top-nav-container {
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        /* ========================================
           CONTENT AREA
           ======================================== */
        
        .content-area {
            background-color: transparent !important;
            border-radius: var(--ubits-border-radius-md, 12px);
            border: none !important;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            overflow: visible;
            box-sizing: border-box;
            max-height: none;
            box-shadow: none !important;
            width: 100%;
            max-width: 100%;
            gap: 0;
        }

        /* ========================================
           HEADER SECTION CONTAINER
           ======================================== */
        
        #header-section-container {
            width: 100%;
            background: transparent;
            padding: 0;
            margin-top: 0;
            margin-bottom: 0;
            box-sizing: border-box;
        }

        /* Ajustes responsive para header-section-container */
        @media (max-width: 1023px) {
            #header-section-container {
                padding: 0;
                margin-top: 0;
            }
        }

        @media (max-width: 479px) {
            #header-section-container {
                margin-top: 0;
            }
        }

        .content-area.no-background {
            background-color: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 var(--ubits-spacing-6xl, 40px) !important;
        }

        /* ========================================
           CONTENT SECTIONS (Sistema de Widgets)
           ======================================== */
        
        .content-sections {
            display: flex;
            flex-direction: column;
            gap: var(--ubits-spacing-lg, 16px);
            flex: 1;
            min-width: 0;
            width: 100%; /* Ocupar el 100% del ancho del content-area */
            max-width: 100%; /* No exceder el ancho del content-area */
            overflow: visible;
            max-height: none;
            box-sizing: border-box;
        }

        .content-sections > *:not(:last-child):not(.section-dual):not(.section-single):not(.section-triple):not(.section-quad) {
            margin-bottom: var(--ubits-spacing-lg, 16px);
        }

        .content-sections::after {
            content: '';
            height: 0px;
            flex-shrink: 0;
        }

        .content-sections > *:last-child {
            margin-bottom: 0;
        }

        /* ========================================
           SECTION TYPES
           ======================================== */
        
        /* Secciones de widgets - igual que el proyecto UBITS original */
        .section-single {
            display: flex;
            width: 100%;
            box-sizing: border-box;
        }

        .section-dual {
            display: flex;
            gap: var(--ubits-spacing-xl, 20px);
            width: 100%;
            box-sizing: border-box;
        }

        .section-triple {
            display: flex;
            gap: var(--ubits-spacing-xl, 20px);
            width: 100%;
            box-sizing: border-box;
        }

        .section-quad {
            display: flex;
            gap: var(--ubits-spacing-xl, 20px);
            width: 100%;
            box-sizing: border-box;
        }

        /* ========================================
           WIDGETS
           ======================================== */
        
        /* Widgets en secciones - igual que el proyecto UBITS original */
        .section-single > div,
        .section-dual > div,
        .section-triple > div,
        .section-quad > div {
            background-color: var(--ubits-bg-1);
            border: none;
            border-radius: var(--ubits-border-radius-sm, 8px);
            padding: var(--ubits-spacing-lg, 16px) !important; /* !important para sobrescribir el reset */
            width: 100%; /* Ocupar el 100% del ancho de la sección */
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            min-width: 0; /* Permitir que se reduzca si es necesario */
        }

        /* Distribución de anchos - igual que el proyecto UBITS original */
        .section-single > div {
            flex: 1;
        }

        .section-dual > div {
            flex: 1;
        }

        .section-triple > div {
            flex: 1;
        }

        .section-quad > div {
            flex: 1;
        }

        /* ========================================
           RESPONSIVE
           ======================================== */
        
        @media (max-width: 1023px) {
            .content-sections {
                padding-bottom: 0;
            }
            
            .section-dual,
            .section-triple,
            .section-quad {
                flex-direction: column;
                gap: var(--ubits-spacing-lg, 16px);
            }
        }

        @media (max-width: 480px) {
            .section-single > div,
            .section-dual > div,
            .section-triple > div,
            .section-quad > div {
                padding: var(--ubits-spacing-md, 12px) !important;
            }
        }

        /* ========================================
           DARK MODE
           ======================================== */
        
        [data-theme="dark"] body {
            background-color: var(--ubits-bg-2) !important;
        }

        [data-theme="dark"] .dashboard-container {
            background-color: var(--ubits-bg-2) !important;
        }

        [data-theme="dark"] .content-area {
            background-color: transparent !important;
            border-color: transparent !important;
        }

        body[data-theme="dark"] {
            background-color: var(--ubits-bg-2) !important;
        }

        body[data-theme="dark"] .dashboard-container {
            background-color: var(--ubits-bg-2) !important;
        }

        body[data-theme="dark"] .content-area {
            background-color: transparent !important;
            border-color: transparent !important;
        }

        /* Transiciones suaves para dark mode */
        body {
            transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *[data-theme] {
            transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        color 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        border-color 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>

    <!-- UBITS Components System -->
    <!-- Los componentes se cargan dinámicamente a través de components-loader.js -->
    
    <script>
        // ========================================
        // INITIALIZATION
        // Usando los componentes reales desde components-loader.js
        // ========================================
        
        // ========================================
        // HELPER FUNCTIONS (Compatibilidad)
        // ========================================
        
        // ========================================
        // DARK MODE SYNC (para Storybook)
        // ========================================
        
        function syncThemeFromParent() {
            // Si estamos en un iframe, intentar obtener el tema del parent (Storybook)
            if (window.parent && window.parent !== window) {
                try {
                    const parentBody = window.parent.document.body;
                    const parentTheme = parentBody.getAttribute('data-theme') || 'light';
                    document.body.setAttribute('data-theme', parentTheme);
                    document.documentElement.setAttribute('data-theme', parentTheme);
                    
                    // Sincronizar con ThemeManager si está disponible
                    if (window.UBITS_ThemeManager) {
                        window.UBITS_ThemeManager.setTheme(parentTheme, false);
                    }
                } catch (e) {
                    // Si hay error de CORS, usar el tema por defecto
                    console.log('⚠️ No se puede acceder al parent (CORS), usando tema light');
                }
            }
        }
        
        // Observar cambios en el tema del parent (Storybook)
        function observeParentTheme() {
            if (window.parent && window.parent !== window) {
                try {
                    // Observar cambios en el atributo data-theme del body del parent
                    const observer = new MutationObserver((mutations) => {
                        mutations.forEach((mutation) => {
                            if (mutation.type === 'attributes' && mutation.attributeName === 'data-theme') {
                                const parentTheme = window.parent.document.body.getAttribute('data-theme') || 'light';
                                document.body.setAttribute('data-theme', parentTheme);
                                document.documentElement.setAttribute('data-theme', parentTheme);
                                
                                // Sincronizar con ThemeManager si está disponible
                                if (window.UBITS_ThemeManager) {
                                    window.UBITS_ThemeManager.setTheme(parentTheme, false);
                                }
                            }
                        });
                    });
                    
                    observer.observe(window.parent.document.body, {
                        attributes: true,
                        attributeFilter: ['data-theme']
                    });
                } catch (e) {
                    // Si hay error de CORS, usar polling como fallback
                    console.log('⚠️ MutationObserver no disponible (CORS), usando polling');
                    setInterval(syncThemeFromParent, 500);
                }
            }
        }
        
        function toggleDarkMode() {
            // Solo usar si NO estamos en Storybook (iframe)
            if (window.parent && window.parent !== window) {
                // En Storybook, el toggle se maneja desde el parent
                return;
            }
            
            if (window.UBITS_ThemeManager) {
                window.UBITS_ThemeManager.toggleTheme();
            } else {
                // Fallback si ThemeManager no está disponible
                const body = document.body;
                const currentTheme = body.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                body.setAttribute('data-theme', newTheme);
                localStorage.setItem('ubits-theme', newTheme);
            }
        }

        // ========================================
        // INITIALIZATION
        // ========================================
        
        // Función para verificar si los CSS se están cargando
        function checkLoadedStylesheets() {
            console.log('🔍 [CSS Check] Verificando hojas de estilo cargadas...');
            const stylesheets = Array.from(document.styleSheets);
            console.log(`📊 [CSS Check] Total de hojas de estilo encontradas: ${stylesheets.length}`);
            
            const criticalCSS = [
                'tokens.css',
                'sidebar.css',
                'subnav.css',
                'tabbar.css',
                'button.css'
            ];
            
            criticalCSS.forEach(cssName => {
                const found = stylesheets.some(sheet => {
                    try {
                        return sheet.href && sheet.href.includes(cssName);
                    } catch (e) {
                        return false;
                    }
                });
                console.log(found ? `✅ [CSS Check] ${cssName} encontrado` : `❌ [CSS Check] ${cssName} NO encontrado`);
            });
            
            // Verificar tokens CSS específicamente
            const tokensSheet = stylesheets.find(sheet => {
                try {
                    return sheet.href && sheet.href.includes('tokens.css');
                } catch (e) {
                    return false;
                }
            });
            
            if (tokensSheet) {
                console.log('✅ [CSS Check] tokens.css encontrado:', tokensSheet.href);
                try {
                    const rules = Array.from(tokensSheet.cssRules || []);
                    console.log(`📊 [CSS Check] Reglas en tokens.css: ${rules.length}`);
                    if (rules.length > 0) {
                        const firstRule = rules[0];
                        console.log('📋 [CSS Check] Primera regla:', firstRule.cssText.substring(0, 100));
                    }
                } catch (e) {
                    console.error('❌ [CSS Check] Error al leer reglas de tokens.css:', e.message);
                }
            } else {
                console.error('❌ [CSS Check] tokens.css NO encontrado en document.styleSheets');
            }
        }
        
        // ⚠️ PREVENIR múltiples ejecuciones del DOMContentLoaded
        let domContentLoadedExecuted = false;
        
        document.addEventListener('DOMContentLoaded', function() {
            // Prevenir ejecuciones múltiples
            if (domContentLoadedExecuted) {
                console.warn('⚠️ [Template Admin] DOMContentLoaded ya ejecutado, ignorando...');
                return;
            }
            domContentLoadedExecuted = true;
            
            // Verificar CSS inmediatamente
            setTimeout(checkLoadedStylesheets, 100);
            
            // Esperar a que todos los sistemas estén listos
            setTimeout(() => {
                // Verificar que todos los sistemas estén cargados
                if (!window.UBITS_ThemeManager || !window.UBITS_ResponsiveManager || !window.UBITS_TemplateLoader) {
                    return;
                }
                
                // Detectar producto actual
                const productId = window.detectCurrentProduct();
                
                // Obtener configuración del producto
                const productConfig = window.getProductConfig(productId);
                
                // Cargar tema guardado
                window.UBITS_ThemeManager.init();
                
                // Sincronizar tema desde Storybook si estamos en un iframe
                syncThemeFromParent();
                observeParentTheme();
                
                // ⚠️ IMPORTANTE: Cargar componentes PRIMERO
                // Luego inicializar responsive para que adapte los componentes ya creados
                window.UBITS_TemplateLoader.loadProduct(productConfig, {
                    sidebar: 'sidebar-container',
                    subnav: 'top-nav-container',
                    tabbar: 'tab-bar-container'
                });
                
                // Inicializar responsive DESPUÉS de que los componentes se hayan cargado
                // Esto asegura que adaptComponents() encuentre los componentes
                setTimeout(() => {
                    // ⚠️ CRÍTICO: Establecer currentSection ANTES de inicializar ResponsiveManager
                    // Esto asegura que adaptComponents() pueda acceder a currentSection cuando se ejecuta
                    const initialSection = productConfig.sidebar.initialActiveSection || 'inicio';
                    if (window.UBITS_ContentManager) {
                        window.UBITS_ContentManager.currentSection = initialSection;
                        console.log('🔍 [Template Admin] ✅ currentSection establecido ANTES de ResponsiveManager.init():', initialSection);
                    }
                    
                    window.UBITS_ResponsiveManager.init();
                    // Ejecutar adaptComponents manualmente después de que los componentes estén listos

          '[data-section="admin"]',
          '[data-section="colaborador"]',
          '.ubits-sidebar-profile-menu .ubits-sidebar-profile-menu-item',
          '.ubits-sidebar-profile-dropdown .ubits-sidebar-profile-menu-item',
          '.ubits-sidebar-profile-menu li',
          '.ubits-sidebar-profile-dropdown li',
          '[class*="profile-menu"] [class*="menu-item"]',
          '[class*="profile-dropdown"] [class*="menu-item"]'
        ];
        
        let menuItems = [];
        selectors.forEach(selector => {
          try {
            const found = document.querySelectorAll(selector);
            if (found.length > 0) {
              menuItems = Array.from(new Set([...menuItems, ...Array.from(found)]));
            }
          } catch (e) {
            // Ignorar errores de selector
          }
        });
        
        // También buscar por texto en todos los elementos clickeables
        const allClickable = document.querySelectorAll('li, button, a, div[onclick], div[role="button"]');
        allClickable.forEach(item => {
          const text = (item.textContent || item.innerText || '').trim();
          if (text.includes('Modo Administrador') || 
              text.includes('Modo administrador') ||
              text.includes('Modo colaborador') || 
              text.includes('Modo Colaborador')) {
            if (!menuItems.includes(item)) {
              menuItems.push(item);
            }
          }
        });
        
        console.log('🔗 [Wizard] Items del menú de perfil encontrados:', menuItems.length);
        
        menuItems.forEach(item => {
          const text = (item.textContent || item.innerText || '').trim();
          const isModeButton = 
            (text.includes('Modo Administrador') || text.includes('Modo administrador')) ||
            (text.includes('Modo colaborador') || text.includes('Modo Colaborador'));
          
          if (isModeButton) {
            console.log('🔗 [Wizard] Botón del menú de perfil encontrado:', text);
            console.log('🔗 [Wizard] Elemento:', item);
            console.log('🔗 [Wizard] Clases:', item.className);
            console.log('🔗 [Wizard] Tag:', item.tagName);
            
            // Interceptar el click con capture phase
            const clickHandler = function(e) {
              e.preventDefault();
              e.stopPropagation();
              e.stopImmediatePropagation();
              console.log('🔗 [Wizard] ✅ Click interceptado en menú de perfil, redirigiendo a:', targetFileName);
              window.location.href = targetFileName;
              return false;
            };
            
            // Agregar listener con capture
            item.addEventListener('click', clickHandler, true);
            
            // También agregar sin capture como backup
            item.addEventListener('click', clickHandler, false);
            
            // Actualizar onclick si existe
            if (item.onclick) {
              const originalOnclick = item.onclick;
              item.onclick = function(e) {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                console.log('🔗 [Wizard] ✅ onclick interceptado en menú, redirigiendo a:', targetFileName);
                window.location.href = targetFileName;
                return false;
              };
            }
            
            // Actualizar atributo onclick
            if (item.getAttribute('onclick')) {
              item.setAttribute('onclick', "event.preventDefault(); event.stopPropagation(); event.stopImmediatePropagation(); window.location.href='" + targetFileName + "'; return false;");
            }
            
            // También actualizar href si existe
            if (item.tagName === 'A') {
              item.href = targetFileName;
              item.addEventListener('click', clickHandler, true);
            } else if (item.querySelector('a')) {
              const link = item.querySelector('a');
              if (link) {
                link.href = targetFileName;
                link.addEventListener('click', clickHandler, true);
              }
            }
            
            // Buscar cualquier elemento hijo que pueda ser clickeable
            const clickableChildren = item.querySelectorAll('a, button, [onclick], [role="button"]');
            clickableChildren.forEach(child => {
              child.addEventListener('click', clickHandler, true);
              if (child.tagName === 'A') {
                child.href = targetFileName;
              }
            });
          }
        });
        
        console.log('🔗 [Wizard] ✅ Enlaces actualizados');
      };
      
      // Ejecutar cuando el DOM esté listo
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', updateTemplateLink);
      } else {
        updateTemplateLink();
      }
      
      // También ejecutar después de delays para asegurar que el sidebar se haya cargado dinámicamente
      setTimeout(updateTemplateLink, 500);
      setTimeout(updateTemplateLink, 1000);
      setTimeout(updateTemplateLink, 2000);
      setTimeout(updateTemplateLink, 3000);
      
      // Observar cambios en el DOM para cuando el sidebar o menú de perfil se cargue dinámicamente
      const observer = new MutationObserver(function(mutations) {
        let shouldUpdate = false;
        mutations.forEach(function(mutation) {
          if (mutation.addedNodes.length > 0) {
            mutation.addedNodes.forEach(function(node) {
              if (node.nodeType === 1) { // Element node
                if (node.classList && (
                  node.classList.contains('ubits-sidebar') ||
                  node.classList.contains('ubits-sidebar-nav-button') ||
                  node.classList.contains('ubits-sidebar-profile-menu') ||
                  node.classList.contains('ubits-sidebar-profile-dropdown') ||
                  node.classList.contains('ubits-sidebar-profile-menu-item') ||
                  node.querySelector('.ubits-sidebar-nav-button') ||
                  node.querySelector('.ubits-sidebar-profile-menu') ||
                  node.querySelector('.ubits-sidebar-profile-dropdown')
                )) {
                  shouldUpdate = true;
                }
              }
            });
          }
        });
        if (shouldUpdate) {
          setTimeout(updateTemplateLink, 100);
        }
      });
      
      observer.observe(document.body, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['class', 'style']
      });
      
      // Interceptar TODOS los clicks en el documento y verificar si es el botón de cambio de modo
      // Esto es más agresivo pero asegura que funcione incluso si el menú se carga dinámicamente
      // IMPORTANTE: targetFileName debe estar en el scope superior para que esté disponible aquí
      document.addEventListener('click', function(e) {
        const target = e.target;
        if (!target) return;
        
        // Verificar si el click es en el avatar para abrir el menú
        if (target.closest('.ubits-sidebar-profile-avatar') ||
            target.closest('[class*="profile-avatar"]') ||
            target.closest('[class*="user-avatar"]')) {
          // El menú de perfil se está abriendo, actualizar después de un delay
          setTimeout(updateTemplateLink, 200);
          setTimeout(updateTemplateLink, 500);
          return;
        }
        
        // Verificar si el click es en un elemento que contiene "Modo colaborador" o "Modo Administrador"
        const clickedElement = target.closest('li, button, a, div[onclick], div[role="button"], [class*="menu-item"]');
        if (clickedElement) {
          const text = (clickedElement.textContent || clickedElement.innerText || '').trim();
          const isModeButton = 
            (text.includes('Modo Administrador') || text.includes('Modo administrador')) ||
            (text.includes('Modo colaborador') || text.includes('Modo Colaborador'));
          
          if (isModeButton) {
            console.log('🔗 [Wizard] 🎯 Click detectado en botón de cambio de modo:', text);
            console.log('🔗 [Wizard] Elemento:', clickedElement);
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            console.log('🔗 [Wizard] ✅ Redirigiendo a:', targetFileName);
            window.location.href = targetFileName;
            return false;
          }
        }
      }, true); // Usar capture phase para interceptar ANTES que otros handlers
    })();
  </script>

</body>
