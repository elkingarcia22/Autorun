    <style>
        /* ========================================
           GLOBAL STYLES
           ======================================== */
        
        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--ubits-bg-2);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overflow-y: auto;
            font-family: var(--font-sans, 'Noto Sans', sans-serif);
            scrollbar-width: thin;
            scrollbar-color: var(--ubits-fg-2-medium-static) var(--ubits-bg-5);
        }

        /* Scrollbar personalizado */
        ::-webkit-scrollbar {
            width: var(--ubits-spacing-sm, 8px);
        }

        ::-webkit-scrollbar-track {
            background: var(--ubits-bg-5);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--ubits-fg-2-medium-static);
            border-radius: var(--ubits-border-radius-xs, 4px);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--ubits-fg-2-high-static);
        }

        /* ========================================
           DASHBOARD CONTAINER
           ======================================== */
        
        .dashboard-container {
            display: flex;
            min-height: 100vh;
            width: 100%;
            overflow: visible;
            /* ⚠️ IMPORTANTE: NO usar justify-content: center aquí */
            /* El margin: auto en .main-content (≥1440px) se encarga del centrado */
        }

        /* ========================================
           TOOLTIP
           ======================================== */
        
        /* ⚠️ NOTA: Los estilos del tooltip del sidebar están en el componente sidebar.css */
        /* No sobrescribir aquí, usar los estilos del componente oficial */

        /* ========================================
           MAIN CONTENT
           ======================================== */
        
        .main-content {
            position: relative;
            flex: 1;
            margin: var(--ubits-spacing-lg, 16px) var(--ubits-spacing-2xl, 24px) 0 calc(var(--ubits-spacing-2xl, 24px) + 96px + 23px);
            width: calc(100% - calc(var(--ubits-spacing-2xl, 24px) + 96px + 23px) - var(--ubits-spacing-2xl, 24px));
            overflow: visible;
            max-height: none;
            display: flex;
            flex-direction: column;
            gap: var(--ubits-spacing-xl, 20px); /* Gap entre SubNav y Content Area */
            z-index: 5;
            box-sizing: border-box;
        }

        /* Centrado para pantallas grandes - EXACTAMENTE igual que el proyecto UBITS original */
        /* El proyecto UBITS original usa margin: auto sin cambiar flex */
        @media (min-width: 1440px) {
            .main-content {
                margin: var(--ubits-spacing-lg, 16px) auto 0 auto; /* ⚠️ margin auto centra el elemento */
                padding-left: calc(var(--ubits-spacing-2xl, 24px) + 96px + 23px); /* Espacio para sidebar (24px + 96px + 23px gap) */
                padding-right: var(--ubits-spacing-2xl, 24px);
                width: 1607px;
                max-width: 1607px;
                box-sizing: border-box;
                /* ⚠️ IMPORTANTE: Mantener flex: 1, igual que el proyecto UBITS original */
                /* NO cambiar a flex: none, el margin: auto funciona con flex: 1 */
            }
        }

        /* Ajustar gap en móvil cuando no hay subnav - igual que el proyecto UBITS original */
        @media (max-width: 1023px) {
            /* ⚠️ CRÍTICO: Ocultar sidebar container, igual que el proyecto UBITS original */
            #sidebar-container {
                display: none !important;
            }
            
            .main-content {
                gap: var(--ubits-spacing-xl, 20px);
                margin: var(--ubits-spacing-lg, 16px) var(--ubits-spacing-md, 12px) 0 var(--ubits-spacing-md, 12px) !important;
                width: calc(100% - var(--ubits-spacing-2xl, 24px));
                padding-left: 0;
                padding-right: 0;
                max-width: 100%;
                padding-bottom: var(--ubits-spacing-6xl, 40px); /* Espacio para el TabBar, igual que el proyecto UBITS original */
            }
            
            .content-area {
                padding-bottom: var(--ubits-spacing-6xl, 40px); /* Espacio para el TabBar, igual que el proyecto UBITS original */
            }
            
            .main-content > *:first-child {
                margin-top: -20px;
            }
        }


        /* ========================================
           CONTENT AREA
           ======================================== */
        
        .content-area {
            background-color: transparent !important;
            border-radius: var(--ubits-border-radius-md, 12px);
            border: none !important;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            overflow: visible;
            box-sizing: border-box;

            box-shadow: none !important;
            padding: 0 40px !important;
        }

        /* ========================================
           CONTENT SECTIONS (Sistema de Widgets)
           ======================================== */
        
        .content-sections {
            display: flex;
            flex-direction: column;
            gap: var(--ubits-spacing-lg, 16px);
            flex: 1;
            min-width: 0;
            width: 100%; /* Ocupar el 100% del ancho del content-area */
            max-width: 100%; /* No exceder el ancho del content-area */
            overflow: visible;
            max-height: none;
            box-sizing: border-box;
        }

        .content-sections > *:not(:last-child):not(.section-dual):not(.section-single):not(.section-triple):not(.section-quad) {
            margin-bottom: var(--ubits-spacing-lg, 16px);
        }

        .content-sections::after {
            content: '';
            height: 0px;
            flex-shrink: 0;
        }

        .content-sections > *:last-child {
            margin-bottom: 0;
        }

        /* ========================================
           SECTION TYPES
           ======================================== */
        
        /* Secciones de widgets - igual que el proyecto UBITS original */
        .section-single {
            display: flex;
            width: 100%;
            box-sizing: border-box;
        }

        .section-dual {
            display: flex;
            gap: var(--ubits-spacing-xl, 20px);
            width: 100%;
            box-sizing: border-box;
        }

        .section-triple {
            display: flex;
            gap: var(--ubits-spacing-xl, 20px);
            width: 100%;
            box-sizing: border-box;
        }

        .section-quad {
            display: flex;
            gap: var(--ubits-spacing-xl, 20px);
            width: 100%;
            box-sizing: border-box;
        }

        /* ========================================
           WIDGETS
           ======================================== */
        
        /* Widgets en secciones - igual que el proyecto UBITS original */
        .section-single > div,
        .section-dual > div,
        .section-triple > div,
        .section-quad > div {
            background-color: var(--ubits-bg-1);
            border: none;
            border-radius: var(--ubits-border-radius-sm, 8px);
            padding: var(--ubits-spacing-lg, 16px) !important; /* !important para sobrescribir el reset */
            width: 100%; /* Ocupar el 100% del ancho de la sección */
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            min-width: 0; /* Permitir que se reduzca si es necesario */
        }

        /* Distribución de anchos - igual que el proyecto UBITS original */
        .section-single > div {
            flex: 1;
        }

        .section-dual > div {
            flex: 1;
        }

        .section-triple > div {
            flex: 1;
        }

        .section-quad > div {
            flex: 1;
        }

        /* ========================================
           RESPONSIVE
           ======================================== */
        
        @media (max-width: 1023px) {
            .content-sections {
                padding-bottom: 0;
            }
            
            .section-dual,
            .section-triple,
            .section-quad {
                flex-direction: column;
                gap: var(--ubits-spacing-lg, 16px);
            }
        }

        @media (max-width: 480px) {
            .section-single > div,
            .section-dual > div,
            .section-triple > div,
            .section-quad > div {
                padding: var(--ubits-spacing-md, 12px) !important;
            }
        }

        /* ========================================
           DARK MODE
           ======================================== */
        
        [data-theme="dark"] body {
            background-color: var(--ubits-bg-2) !important;
        }

        [data-theme="dark"] .dashboard-container {
            background-color: var(--ubits-bg-2) !important;
        }

        [data-theme="dark"] .content-area {
            background-color: transparent !important;
            border-color: transparent !important;
        }

        body[data-theme="dark"] {
            background-color: var(--ubits-bg-2) !important;
        }

        body[data-theme="dark"] .dashboard-container {
            background-color: var(--ubits-bg-2) !important;
        }

        body[data-theme="dark"] .content-area {
            background-color: transparent !important;
            border-color: transparent !important;
        }

        /* Transiciones suaves para dark mode */
        body {
            transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *[data-theme] {
            transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        color 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        border-color 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>

        // Verificar que los CSS se hayan cargado

                const found = stylesheets.some(sheet => {

        // ========================================

        // ========================================
        // DARK MODE SYNC (para Storybook)
        // ========================================
        
        function syncThemeFromParent() {
            // Si estamos en un iframe, intentar obtener el tema del parent (Storybook)
            if (window.parent && window.parent !== window) {
                try {
                    const parentBody = window.parent.document.body;
                    const parentTheme = parentBody.getAttribute('data-theme') || 'light';
                    document.body.setAttribute('data-theme', parentTheme);
                    document.documentElement.setAttribute('data-theme', parentTheme);
                    
                    // Sincronizar con ThemeManager si está disponible
                    if (window.UBITS_ThemeManager) {
                        window.UBITS_ThemeManager.setTheme(parentTheme, false);
                    }
                } catch (e) {
                    // Si hay error de CORS, usar el tema por defecto
                    console.log('⚠️ No se puede acceder al parent (CORS), usando tema light');
                }
            }
        }
        
        // Observar cambios en el tema del parent (Storybook)
        function observeParentTheme() {
            if (window.parent && window.parent !== window) {
                try {
                    // Observar cambios en el atributo data-theme del body del parent
                    const observer = new MutationObserver((mutations) => {
                        mutations.forEach((mutation) => {
                            if (mutation.type === 'attributes' && mutation.attributeName === 'data-theme') {
                                const parentTheme = window.parent.document.body.getAttribute('data-theme') || 'light';
                                document.body.setAttribute('data-theme', parentTheme);
                                document.documentElement.setAttribute('data-theme', parentTheme);
                                
                                // Sincronizar con ThemeManager si está disponible
                                if (window.UBITS_ThemeManager) {
                                    window.UBITS_ThemeManager.setTheme(parentTheme, false);
                                }
                            }
                        });
                    });
                    
                    observer.observe(window.parent.document.body, {
                        attributes: true,
                        attributeFilter: ['data-theme']
                    });
                } catch (e) {
                    // Si hay error de CORS, usar polling como fallback
                    console.log('⚠️ MutationObserver no disponible (CORS), usando polling');
                    setInterval(syncThemeFromParent, 500);
                }
            }
        }
        
        function toggleDarkMode() {
            // Solo usar si NO estamos en Storybook (iframe)
            if (window.parent && window.parent !== window) {
                // En Storybook, el toggle se maneja desde el parent
                return;
            }
            
            if (window.UBITS_ThemeManager) {
                window.UBITS_ThemeManager.toggleTheme();
            } else {
                // Fallback si ThemeManager no está disponible

                      const isActive = tab.classList.contains('ubits-sub-nav-tab--active');
                      console.log('   Tab', idx + ':', {
                        dataTab: dataTab,
                        text: text,
                        isActive: isActive,
                        classes: tab.className,
                        innerHTML: tab.innerHTML.substring(0, 100)
                      });
                    });
                    
                    // Remover active de todos los tabs
                    console.log('🔍 [Wizard] [SubNav] Removiendo active de todos los tabs...');
                    allTabs.forEach(tab => {
                      tab.classList.remove('ubits-sub-nav-tab--active');
                    });
                    
                    // Activar el tab correspondiente al producto
                    // Primero intentar con el tabId mapeado
                    console.log('🔍 [Wizard] [SubNav] Buscando tab con data-tab="' + tabId + '"...');
                    let targetTab = subNavElement.querySelector('[data-tab="' + tabId + '"]');
                    
                    // Si no se encuentra, intentar con el producto original
                    if (!targetTab) {
                      console.log('🔍 [Wizard] [SubNav] Tab no encontrado con tabId mapeado, intentando con producto original...');
                      targetTab = subNavElement.querySelector('[data-tab="inicio"]');
                    }
                    
                    // Si aún no se encuentra, intentar buscar por texto
                    if (!targetTab) {
                      console.log('🔍 [Wizard] [SubNav] Tab no encontrado por data-tab, buscando por texto...');
                      const productText = 'inicio'.toLowerCase();
                      Array.from(allTabs).forEach(tab => {
                        const text = tab.textContent?.trim().toLowerCase();
                        // Buscar coincidencias parciales
                        if (text.includes(productText) || productText.includes(text) || 
                            (productText.includes('inicio') && text.includes('inicio')) ||
                            (productText.includes('matriz') && text.includes('matriz')) ||
                            (productText.includes('talento') && text.includes('talento'))) {
                          console.log('🔍 [Wizard] [SubNav] Tab encontrado por texto:', text);
                          targetTab = tab;
                        }
                      });
                    }
                    
                    if (targetTab) {
                      console.log('🔍 [Wizard] [SubNav] ✅ Tab encontrado:', {
                        dataTab: targetTab.getAttribute('data-tab'),
                        text: targetTab.textContent?.trim(),
                        classes: targetTab.className
                      });
                      targetTab.classList.add('ubits-sub-nav-tab--active');
                      console.log('🔍 [Wizard] [SubNav] ✅ Clase ubits-sub-nav-tab--active agregada');
                      
                      // Verificar que se agregó correctamente
                      const hasActive = targetTab.classList.contains('ubits-sub-nav-tab--active');
                      console.log('🔍 [Wizard] [SubNav] Verificación - tiene clase active:', hasActive);
                      
                      // Verificar estado final
                      const activeTab = document.querySelector('.ubits-sub-nav-tab--active');
                      console.log('🔍 [Wizard] [SubNav] Tab activo confirmado:', {
                        dataTab: activeTab?.getAttribute('data-tab') || 'ninguno',
                        text: activeTab?.textContent?.trim() || 'ninguno',
                        element: activeTab ? 'encontrado' : 'no encontrado'
                      });
                      return true; // Éxito
                    } else {
                      console.warn('🔍 [Wizard] [SubNav] ⚠️ Tab "inicio" no encontrado en SubNav');
                      console.warn('🔍 [Wizard] [SubNav] Producto buscado:', 'inicio');
                      if (attempts < maxAttempts) {
                        console.log('🔍 [Wizard] [SubNav] Reintentando en 200ms...');
                        setTimeout(activateTab, 200);
                      } else {
                        console.error('🔍 [Wizard] [SubNav] ❌ Máximo de intentos alcanzado');
                      }
                      return false;
                    }
                  }
                } else {
                  console.warn('🔍 [Wizard] [SubNav] ⚠️ SubNav no encontrado, reintentando...');
                  if (attempts < maxAttempts) {
                    setTimeout(activateTab, 200);
                  } else {
                    console.error('🔍 [Wizard] [SubNav] ❌ Máximo de intentos alcanzado sin encontrar SubNav');
                  }
                  return false;
                }
              };
              
              // Iniciar después de que updateContent termine
              console.log('🔍 [Wizard] [SubNav] Programando activación del tab en 300ms...');
              setTimeout(activateTab, 300);
            } else {
              console.log('🔍 [Wizard] No hay producto para activar');
            }
          } else {
            console.log('🔍 [Wizard] ⏳ Módulo aún no está activo, esperando...');
            console.log('🔍 [Wizard] currentSection:', window.UBITS_ContentManager.currentSection);
            console.log('🔍 [Wizard] Esperado:', normalizedModule);
            // Si el módulo aún no está activo, esperar un poco más
            setTimeout(activateProduct, 200);
          }
        } catch (error) {
          console.error('🔍 [Wizard] ❌ Error al activar producto:', error);
          console.error('🔍 [Wizard] Stack:', error.stack);
        }
      };
      
      // Esperar a que el template termine su inicialización (el template usa setTimeout de ~1500ms)
      console.log('🔍 [Wizard] ⏳ Esperando 2500ms para que el template termine su inicialización...');
      setTimeout(() => {
        console.log('🔍 [Wizard] ⏰ Timeout completado, ejecutando activateProduct...');
        activateProduct();
      }, 2500);
    });
    
    // Interceptar llamadas a handleSectionChange para ver qué está pasando
    const originalHandleSectionChange = window.UBITS_ContentManager?.handleSectionChange;
    if (originalHandleSectionChange) {
      window.UBITS_ContentManager.handleSectionChange = function(section, activeTabId) {
        console.log('🔍 [Wizard] ════════════════════════════════════════');
        console.log('🔍 [Wizard] 🔄 handleSectionChange INTERCEPTADO');
        console.log('🔍 [Wizard] section:', section);
        console.log('🔍 [Wizard] activeTabId:', activeTabId);
        console.log('🔍 [Wizard] currentSection antes:', this.currentSection);
        return originalHandleSectionChange.call(this, section, activeTabId);
      };
    } else {
      // Si ContentManager aún no existe, interceptarlo cuando se cree
      Object.defineProperty(window, 'UBITS_ContentManager', {
        set: function(value) {
          console.log('🔍 [Wizard] UBITS_ContentManager definido');
          if (value && value.handleSectionChange) {
            const original = value.handleSectionChange;
            value.handleSectionChange = function(section, activeTabId) {
              console.log('🔍 [Wizard] ════════════════════════════════════════');
              console.log('🔍 [Wizard] 🔄 handleSectionChange INTERCEPTADO (desde setter)');
              console.log('🔍 [Wizard] section:', section);
              console.log('🔍 [Wizard] activeTabId:', activeTabId);
              console.log('🔍 [Wizard] currentSection antes:', this.currentSection);
              return original.call(this, section, activeTabId);
            };
          }
          Object.defineProperty(window, 'UBITS_ContentManager', { value, writable: true, configurable: true });
        },
        get: function() {
          return window._UBITS_ContentManager;
        },
        configurable: true
      });
    }
  </script>
</body>
</html>
