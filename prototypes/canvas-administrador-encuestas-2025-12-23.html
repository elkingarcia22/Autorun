    <style>
        /* ========================================
           GLOBAL STYLES
           ======================================== */
        
        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--ubits-bg-2);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overflow-y: auto;
            font-family: var(--font-sans, 'Noto Sans', sans-serif);
            scrollbar-width: thin;
            scrollbar-color: var(--ubits-fg-2-medium-static) var(--ubits-bg-5);
        }

        /* Scrollbar personalizado */
        ::-webkit-scrollbar {
            width: var(--ubits-spacing-sm, 8px);
        }

        ::-webkit-scrollbar-track {
            background: var(--ubits-bg-5);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--ubits-fg-2-medium-static);
            border-radius: var(--ubits-border-radius-xs, 4px);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--ubits-fg-2-high-static);
        }

        /* ========================================
           DASHBOARD CONTAINER
           ======================================== */
        
        .dashboard-container {
            display: flex;
            min-height: 100vh;
            width: 100%;
            overflow: visible;
            /* ⚠️ IMPORTANTE: NO usar justify-content: center aquí */
            /* El margin: auto en .main-content (≥1440px) se encarga del centrado */
        }

        /* ========================================
           TOOLTIP
           ======================================== */
        
        /* ⚠️ NOTA: Los estilos del tooltip del sidebar están en el componente sidebar.css */
        /* No sobrescribir aquí, usar los estilos del componente oficial */
        
        /* Asegurar que la línea divisoria del footer del sidebar se muestre */
        .ubits-sidebar-footer {
            position: relative !important;
        }
        
        .ubits-sidebar-footer::before {
            content: '' !important;
            position: absolute !important;
            top: 0 !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            width: 32px !important;
            height: 1px !important;
            background-color: var(--ubits-fg-1-medium, #5c646f) !important;
        }
        
        [data-theme="dark"] .ubits-sidebar-footer::before {
            background-color: var(--ubits-fg-1-medium, #d0d2d5) !important;
        }

        /* ========================================
           MAIN CONTENT
           ======================================== */
        
        .main-content {
            position: relative;
            flex: 1;
            margin: var(--ubits-spacing-lg, 16px) var(--ubits-spacing-2xl, 24px) 0 calc(var(--ubits-spacing-2xl, 24px) + 96px + 23px);
            width: calc(100% - calc(var(--ubits-spacing-2xl, 24px) + 96px + 23px) - var(--ubits-spacing-2xl, 24px));
            overflow: visible;
            max-height: none;
            display: flex;
            flex-direction: column;
            gap: var(--ubits-spacing-xl, 20px); /* Gap entre SubNav y Content Area */
            z-index: 5;
            box-sizing: border-box;
        }

        /* Centrado para pantallas grandes - EXACTAMENTE igual que el proyecto UBITS original */
        /* El proyecto UBITS original usa margin: auto sin cambiar flex */
        @media (min-width: 1440px) {
            .main-content {
                margin: var(--ubits-spacing-lg, 16px) auto 0 auto; /* ⚠️ margin auto centra el elemento */
                padding-left: calc(var(--ubits-spacing-2xl, 24px) + 96px + 23px); /* Espacio para sidebar (24px + 96px + 23px gap) */
                padding-right: var(--ubits-spacing-2xl, 24px);
                width: 1607px;
                max-width: 1607px;
                box-sizing: border-box;
                /* ⚠️ IMPORTANTE: Mantener flex: 1, igual que el proyecto UBITS original */
                /* NO cambiar a flex: none, el margin: auto funciona con flex: 1 */
            }
        }

        /* Ajustar gap en móvil cuando no hay subnav - igual que el proyecto UBITS original */
        @media (max-width: 1023px) {
            /* ⚠️ CRÍTICO: Ocultar sidebar container, igual que el proyecto UBITS original */
            #sidebar-container {
                display: none !important;
            }
            
            .main-content {
                gap: var(--ubits-spacing-xl, 20px);
                margin: var(--ubits-spacing-lg, 16px) var(--ubits-spacing-md, 12px) 0 var(--ubits-spacing-md, 12px) !important;
                width: calc(100% - var(--ubits-spacing-2xl, 24px));
                padding-left: 0;
                padding-right: 0;
                max-width: 100%;
                padding-bottom: var(--ubits-spacing-6xl, 40px); /* Espacio para el TabBar, igual que el proyecto UBITS original */
            }
            
            .content-area {
                padding-bottom: var(--ubits-spacing-6xl, 40px); /* Espacio para el TabBar, igual que el proyecto UBITS original */
            }
            
            .main-content > *:first-child {
                margin-top: calc(-1 * var(--ubits-spacing-xl, 20px));
            }
        }

        /* ========================================
           TOP NAV CONTAINER (SubNav)
           ======================================== */

        /* El SubNav debe mantener sus estilos originales del componente */
        /* Solo establecer el contenedor para que el componente SubNav funcione correctamente */
        #top-nav-container {
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        /* ========================================
           SUB NAV CONTAINER
           ======================================== */
        
        #top-nav-container {
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        /* ========================================
           CONTENT AREA
           ======================================== */
        
        .content-area {
            background-color: transparent !important;
            border-radius: var(--ubits-border-radius-md, 12px);
            border: none !important;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            overflow: visible;
            box-sizing: border-box;
            max-height: none;
            box-shadow: none !important;
            width: 100%;
            max-width: 100%;
            gap: 0;
        }

        /* ========================================
           HEADER SECTION CONTAINER
           ======================================== */
        
        #header-section-container {
            width: 100%;
            background: transparent;
            padding: 0;
            margin-top: 0;
            margin-bottom: 0;
            box-sizing: border-box;
        }

        /* Ajustes responsive para header-section-container */
        @media (max-width: 1023px) {
            #header-section-container {
                padding: 0;
                margin-top: 0;
            }
        }

        @media (max-width: 479px) {
            #header-section-container {
                margin-top: 0;
            }
        }

        .content-area.no-background {
            background-color: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 var(--ubits-spacing-6xl, 40px) !important;
        }

        /* ========================================
           CONTENT SECTIONS (Sistema de Widgets)
           ======================================== */
        
        .content-sections {
            display: flex;
            flex-direction: column;
            gap: var(--ubits-spacing-lg, 16px);
            flex: 1;
            min-width: 0;
            width: 100%; /* Ocupar el 100% del ancho del content-area */
            max-width: 100%; /* No exceder el ancho del content-area */
            overflow: visible;
            max-height: none;
            box-sizing: border-box;
        }

        .content-sections > *:not(:last-child):not(.section-dual):not(.section-single):not(.section-triple):not(.section-quad) {
            margin-bottom: var(--ubits-spacing-lg, 16px);
        }

        .content-sections::after {
            content: '';
            height: 0px;
            flex-shrink: 0;
        }

        .content-sections > *:last-child {
            margin-bottom: 0;
        }

        /* ========================================
           SECTION TYPES
           ======================================== */
        
        /* Secciones de widgets - igual que el proyecto UBITS original */
        .section-single {
            display: flex;
            width: 100%;
            box-sizing: border-box;
        }

        .section-dual {
            display: flex;
            gap: var(--ubits-spacing-xl, 20px);
            width: 100%;
            box-sizing: border-box;
        }

        .section-triple {
            display: flex;
            gap: var(--ubits-spacing-xl, 20px);
            width: 100%;
            box-sizing: border-box;
        }

        .section-quad {
            display: flex;
            gap: var(--ubits-spacing-xl, 20px);
            width: 100%;
            box-sizing: border-box;
        }

        /* ========================================
           WIDGETS
           ======================================== */
        
        /* Widgets en secciones - igual que el proyecto UBITS original */
        .section-single > div,
        .section-dual > div,
        .section-triple > div,
        .section-quad > div {
            background-color: var(--ubits-bg-1);
            border: none;
            border-radius: var(--ubits-border-radius-sm, 8px);
            padding: var(--ubits-spacing-lg, 16px) !important; /* !important para sobrescribir el reset */
            width: 100%; /* Ocupar el 100% del ancho de la sección */
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            min-width: 0; /* Permitir que se reduzca si es necesario */
        }

        /* Distribución de anchos - igual que el proyecto UBITS original */
        .section-single > div {
            flex: 1;
        }

        .section-dual > div {
            flex: 1;
        }

        .section-triple > div {
            flex: 1;
        }

        .section-quad > div {
            flex: 1;
        }

        /* ========================================
           RESPONSIVE
           ======================================== */
        
        @media (max-width: 1023px) {
            .content-sections {
                padding-bottom: 0;
            }
            
            .section-dual,
            .section-triple,
            .section-quad {
                flex-direction: column;
                gap: var(--ubits-spacing-lg, 16px);
            }
        }

        @media (max-width: 480px) {
            .section-single > div,
            .section-dual > div,
            .section-triple > div,
            .section-quad > div {
                padding: var(--ubits-spacing-md, 12px) !important;
            }
        }

        /* ========================================
           DARK MODE
           ======================================== */
        
        [data-theme="dark"] body {
            background-color: var(--ubits-bg-2) !important;
        }

        [data-theme="dark"] .dashboard-container {
            background-color: var(--ubits-bg-2) !important;
        }

        [data-theme="dark"] .content-area {
            background-color: transparent !important;
            border-color: transparent !important;
        }

        body[data-theme="dark"] {
            background-color: var(--ubits-bg-2) !important;
        }

        body[data-theme="dark"] .dashboard-container {
            background-color: var(--ubits-bg-2) !important;
        }

        body[data-theme="dark"] .content-area {
            background-color: transparent !important;
            border-color: transparent !important;
        }

        /* Transiciones suaves para dark mode */
        body {
            transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *[data-theme] {
            transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        color 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        border-color 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>

  <style>
    /* Fix: Asegurar que el botón activo del sidebar sea visible en dark mode */
    body[data-theme="dark"] .ubits-sidebar-nav-button.active,
    html[data-theme="dark"] .ubits-sidebar-nav-button.active {
      background: var(--ubits-sidebar-button-bg-active, #ffffff) !important;
    }
    
    /* Asegurar que el icono del botón activo sea visible en dark mode */
    body[data-theme="dark"] .ubits-sidebar-nav-button.active i,
    html[data-theme="dark"] .ubits-sidebar-nav-button.active i {
      color: var(--ubits-sidebar-button-fg-active, #303a47) !important;
    }
    
    /* Fix: Asegurar que el indicador activo del subnav (flechita azul) sea visible */
    /* NO sobrescribir el background-color - dejar que el componente use sus propios tokens:
       - Light mode: --ubits-accent-brand-static (definido en subnav.css línea 118)
       - Dark mode: --modifiers-normal-color-dark-accent-blue (definido en subnav.css línea 128)
    */
    .ubits-sub-nav-tab.ubits-sub-nav-tab--active::after {
      content: '' !important;
      position: absolute !important;
      bottom: 0 !important;
      left: 0 !important;
      right: 0 !important;
      height: 3px !important;
      border-radius: 0 !important;
      z-index: 1 !important;
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      width: auto !important;
      /* NO sobrescribir background-color - el componente ya lo maneja correctamente */
    }
    
    /* En dark mode, solo asegurar visibilidad - el componente ya usa --modifiers-normal-color-dark-accent-blue */

          console.log('🔗 [Wizard] Botón encontrado con data-section:', section);
          
          // Interceptar el click del botón
          button.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            console.log('🔗 [Wizard] Click interceptado en botón del sidebar, redirigiendo a:', targetFileName);
            window.location.href = targetFileName;
            return false;
          }, true); // Usar capture phase para interceptar antes que otros handlers
          
          // También actualizar onclick si existe
          if (button.onclick) {
            const originalOnclick = button.onclick;
            button.onclick = function(e) {
              e.preventDefault();

        // 2. Buscar el botón del menú de perfil que cambia entre templates

        const selectors = [

          '.ubits-sidebar-profile-menu .ubits-sidebar-profile-menu-item',

        ];
        
        let menuItems = [];

          try {
            const found = document.querySelectorAll(selector);
            if (found.length > 0) {
              menuItems = Array.from(new Set([...menuItems, ...Array.from(found)]));
            }
          } catch (e) {
            // Ignorar errores de selector

        // También buscar por texto en todos los elementos clickeables

            console.log('🔗 [Wizard] Tag:', item.tagName);
            
            // Actualizar href PRIMERO para que apunte al archivo correcto
            if (item.tagName === 'A') {
              item.href = targetFileName;
              item.setAttribute('href', targetFileName);
            } else if (item.querySelector('a')) {
              const link = item.querySelector('a');
              if (link) {
                link.href = targetFileName;
                link.setAttribute('href', targetFileName);
              }
            }
            
            // También actualizar data-href si existe
            if (item.hasAttribute('data-href')) {
              item.setAttribute('data-href', targetFileName);
            }
            
            // Interceptar el click con capture phase (máxima prioridad)
            const clickHandler = function(e) {
              console.log('🔗 [Wizard] ✅ Click interceptado en menú de perfil, redirigiendo a:', targetFileName);
              e.preventDefault();
              e.stopPropagation();
              e.stopImmediatePropagation();
              e.cancelBubble = true;
              // Navegar directamente sin abrir nueva pestaña
              window.location.href = targetFileName;
              return false;
            };
            
            // Agregar listener con capture (máxima prioridad)
            item.addEventListener('click', clickHandler, { capture: true, passive: false });
            
            // También agregar sin capture como backup
            item.addEventListener('click', clickHandler, { capture: false, passive: false });
            
            // Actualizar onclick si existe (sobrescribir completamente)
              item.onclick = function(e) {

              }
                window.location.href = targetFileName;
                return false;

            // Actualizar atributo onclick

            // Buscar cualquier elemento hijo que pueda ser clickeable

      const observer = new MutationObserver(function(mutations) {
        let shouldUpdate = false;
        mutations.forEach(function(mutation) {
          if (mutation.addedNodes.length > 0) {
            mutation.addedNodes.forEach(function(node) {
              if (node.nodeType === 1) { // Element node
                if (node.classList && (
                  node.classList.contains('ubits-sidebar') ||

          setTimeout(updateTemplateLink, 100);
        }
      });
      
      observer.observe(document.body, {

        subtree: true,
        attributes: true,
        attributeFilter: ['class', 'style']
      });
      
      // Interceptar TODOS los clicks en el documento y verificar si es el botón de cambio de modo
      // Esto es más agresivo pero asegura que funcione incluso si el menú se carga dinámicamente
      // IMPORTANTE: targetFileName debe estar en el scope superior para que esté disponible aquí

        const clickedElement = target.closest('li, button, a, div[onclick], div[role="button"], [class*="menu-item"], [class*="profile-menu"]');

            window.location.href = targetFileName;
            return false;
          }
        }
      }, { capture: true, passive: false }); // Capture phase con máxima prioridad
      
      // También interceptar en el phase de bubbling como backup
      document.addEventListener('click', function(e) {
        const target = e.target;
        if (!target) return;
        
        const clickedElement = target.closest('li, button, a, div[onclick], div[role="button"], [class*="menu-item"], [class*="profile-menu"]');
        if (clickedElement) {
          const text = (clickedElement.textContent || clickedElement.innerText || '').trim();
          const isModeButton = 
            (text.includes('Modo Administrador') || text.includes('Modo administrador')) ||
            (text.includes('Modo colaborador') || text.includes('Modo Colaborador'));
          
          if (isModeButton) {

            e.stopPropagation();
            e.stopImmediatePropagation();
            e.cancelBubble = true;
            console.log('🔗 [Wizard] ✅ Redirigiendo a:', targetFileName);
            window.location.href = targetFileName;
            return false;
          }
        }
      }, { capture: false, passive: false }); // Bubbling phase como backup
    })();
  </script>

        // ========================================
        // DARK MODE SYNC (para Storybook)
        // ========================================
        
        function syncThemeFromParent() {
            // Si estamos en un iframe, intentar obtener el tema del parent (Storybook)
            if (window.parent && window.parent !== window) {
                try {
                    const parentBody = window.parent.document.body;
                    const parentTheme = parentBody.getAttribute('data-theme') || 'light';
                    document.body.setAttribute('data-theme', parentTheme);
                    document.documentElement.setAttribute('data-theme', parentTheme);
                    
                    // Sincronizar con ThemeManager si está disponible
                    if (window.UBITS_ThemeManager) {
                        window.UBITS_ThemeManager.setTheme(parentTheme, false);
                    }
                } catch (e) {
                    // Si hay error de CORS, usar el tema por defecto
                    console.log('⚠️ No se puede acceder al parent (CORS), usando tema light');
                }
            }
        }
        
        // Observar cambios en el tema del parent (Storybook)
        function observeParentTheme() {
            if (window.parent && window.parent !== window) {
                try {
                    // Observar cambios en el atributo data-theme del body del parent
                    const observer = new MutationObserver((mutations) => {
                        mutations.forEach((mutation) => {
                            if (mutation.type === 'attributes' && mutation.attributeName === 'data-theme') {
                                const parentTheme = window.parent.document.body.getAttribute('data-theme') || 'light';
                                document.body.setAttribute('data-theme', parentTheme);
                                document.documentElement.setAttribute('data-theme', parentTheme);
                                
                                // Sincronizar con ThemeManager si está disponible
                                if (window.UBITS_ThemeManager) {
                                    window.UBITS_ThemeManager.setTheme(parentTheme, false);
                                }
                            }
                        });
                    });
                    
                    observer.observe(window.parent.document.body, {
                        attributes: true,
                        attributeFilter: ['data-theme']
                    });
                } catch (e) {
                    // Si hay error de CORS, usar polling como fallback
                    console.log('⚠️ MutationObserver no disponible (CORS), usando polling');
                    setInterval(syncThemeFromParent, 500);
                }
            }
        }
        
        function toggleDarkMode() {
            // Solo usar si NO estamos en Storybook (iframe)
            if (window.parent && window.parent !== window) {

                return;

            if (window.UBITS_ThemeManager) {
                window.UBITS_ThemeManager.toggleTheme();
            } else {
                // Fallback si ThemeManager no está disponible
                const body = document.body;
                const currentTheme = body.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

                    const styles = window.getComputedStyle(target, '::after');
                    console.log('🔵 [SubNav Fix] Estilos ::after después de restaurar:', {
                      content: styles.content,
                      display: styles.display,
                      visibility: styles.visibility,
                      opacity: styles.opacity,
                      backgroundColor: styles.backgroundColor
                    });
                  }, 50);
                } else {
                  console.log('🔵 [SubNav Fix] ✅ Tab correcto ya tiene clase active');
                }
              } else {
                console.log('🔵 [SubNav Fix] Tab no es el objetivo, ignorando');
              }
            }
          }
        } else if (mutation.type === 'childList') {
          console.log('🔵 [SubNav Fix] MutationObserver: Cambio en childList detectado');
          mutation.addedNodes.forEach((node) => {
            if (node.nodeType === 1 && node.classList?.contains('ubits-sub-nav-tab')) {
              console.log('🔵 [SubNav Fix] Nuevo tab agregado:', node.getAttribute('data-tab'));
            }
          });
        }
      });
    });
    
    // Observar el contenedor del subnav
    setTimeout(() => {
      console.log('🔵 [SubNav Fix] Configurando MutationObserver...');
      const subNavContainer = document.querySelector('#top-nav-container') || 
                             document.querySelector('.ubits-sub-nav');
      if (subNavContainer) {
        console.log('🔵 [SubNav Fix] ✅ Contenedor encontrado, iniciando observación');
        observer.observe(subNavContainer, {
          attributes: true,
          attributeFilter: ['class'],
          subtree: true,
          childList: true
        });
        console.log('🔵 [SubNav Fix] ✅ MutationObserver activo');
      } else {
        console.error('🔵 [SubNav Fix] ❌ Contenedor del subnav no encontrado');
      }
    }, 1000);
    
    if (!originalHandleSectionChange) {
      // Si ContentManager aún no existe, interceptarlo cuando se cree
      Object.defineProperty(window, 'UBITS_ContentManager', {
        set: function(value) {
          console.log('🔍 [Wizard] UBITS_ContentManager definido');
          if (value && value.handleSectionChange) {
            const original = value.handleSectionChange;
            value.handleSectionChange = function(section, activeTabId) {
              console.log('🔍 [Wizard] ════════════════════════════════════════');
              console.log('🔍 [Wizard] 🔄 handleSectionChange INTERCEPTADO (desde setter)');
              console.log('🔍 [Wizard] section:', section);
              console.log('🔍 [Wizard] activeTabId:', activeTabId);
              console.log('🔍 [Wizard] currentSection antes:', this.currentSection);
              return original.call(this, section, activeTabId);
            };
          }
          Object.defineProperty(window, 'UBITS_ContentManager', { value, writable: true, configurable: true });
        },
        get: function() {
          return window._UBITS_ContentManager;
        },
        configurable: true
      });
    }
  </script>

  <script>
    // Desactivar navegación de otros módulos en el sidebar
    (function() {
      const currentModule = 'encuestas';
      
      function disableOtherModules() {
        const sidebar = document.querySelector('.ubits-sidebar');
        if (!sidebar) {
          // Si el sidebar aún no está cargado, reintentar
          setTimeout(disableOtherModules, 100);
          return;
        }
        
        // Buscar todos los botones del sidebar
        const allButtons = sidebar.querySelectorAll('.ubits-sidebar-nav-button');
        let disabledCount = 0;
        
        allButtons.forEach(button => {
          const buttonModule = button.getAttribute('data-section');
          
          // Si el botón NO es del módulo actual, deshabilitarlo
          if (buttonModule && buttonModule !== currentModule) {
            // Remover el atributo data-section para que no funcione el click
            button.removeAttribute('data-section');
            
            // Deshabilitar el botón visualmente
            button.style.opacity = '0.5';
            button.style.cursor = 'not-allowed';
            button.style.pointerEvents = 'none';
            
            // Prevenir cualquier click
            button.addEventListener('click', function(e) {
              e.preventDefault();
              e.stopPropagation();
              return false;
            }, true);
            
            disabledCount++;
          }
        });
        
        // Desactivar el logo de UBITS que lleva al inicio
        const logoElements = sidebar.querySelectorAll('a[href*="inicio"], .ubits-sidebar-logo, .ubits-logo, [data-section="inicio"]');
        logoElements.forEach(logo => {
          // Remover atributos de navegación
          logo.removeAttribute('href');
          logo.removeAttribute('data-section');
          
          // Deshabilitar visualmente
          logo.style.opacity = '0.5';
          logo.style.cursor = 'not-allowed';
          logo.style.pointerEvents = 'none';
          
          // Prevenir cualquier click
          logo.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }, true);
          
          disabledCount++;
        });
        
        // También buscar el logo por su posición común (primer elemento del sidebar)
        const sidebarHeader = sidebar.querySelector('.ubits-sidebar-header, .sidebar-header, [class*="header"]');
        if (sidebarHeader) {
          const headerLinks = sidebarHeader.querySelectorAll('a');
          headerLinks.forEach(link => {
            // Si el enlace apunta al inicio o no tiene data-section específico, desactivarlo
            const href = link.getAttribute('href') || '';
            const dataSection = link.getAttribute('data-section') || '';
            if (href.includes('inicio') || dataSection === 'inicio' || (!dataSection && href !== '#')) {
              link.removeAttribute('href');
              link.removeAttribute('data-section');
              link.style.opacity = '0.5';
              link.style.cursor = 'not-allowed';
              link.style.pointerEvents = 'none';
              link.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                return false;
              }, true);
              disabledCount++;
            }
          });
        }
        
        if (disabledCount > 0) {
          console.log('🔒 [Navegación] Desactivados ' + disabledCount + ' elemento(s) del sidebar (módulos + logo)');
        }
      }
      
      // Ejecutar cuando el DOM esté listo
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', disableOtherModules);
      } else {
        disableOtherModules();
      }
      
      // También ejecutar después de que el sidebar se cargue dinámicamente
      setTimeout(disableOtherModules, 500);
      setTimeout(disableOtherModules, 1000);
      setTimeout(disableOtherModules, 2000);
      
      // Observar cambios en el DOM para cuando el sidebar se cargue
      const observer = new MutationObserver((mutations) => {
        let shouldDisable = false;
        mutations.forEach((mutation) => {
          if (mutation.addedNodes.length > 0) {
            mutation.addedNodes.forEach((node) => {
              if (node.nodeType === 1 && 
                  (node.classList?.contains('ubits-sidebar') || 
                   node.querySelector?.('.ubits-sidebar-nav-button'))) {
                shouldDisable = true;
              }
            });
          }
        });
        if (shouldDisable) {
          setTimeout(disableOtherModules, 100);
        }
      });
      
      observer.observe(document.body, {
        childList: true,
        subtree: true
      });
    })();
  </script>

  <script>
    // ⭐ SISTEMA AUTOMÁTICO DE PRESERVACIÓN DE COMPONENTES
    // Este script facilita agregar componentes sin que desaparezcan con ContentManager
    // Mantiene todas las funcionalidades del template (sidebar, navbar, responsive)
    
    (function() {
      // Sistema simple de preservación automática
      window.AUTORUN_PRESERVE_COMPONENTS = window.AUTORUN_PRESERVE_COMPONENTS || {
        components: new Map(),
        
        // Registrar un componente para preservación automática
        register: function(componentId, containerId, handlers) {
          const key = componentId + '-' + containerId;
          this.components.set(key, {
            componentId,
            containerId,
            handlers: handlers || {},
            html: null
          });
          console.log('🔒 [AutoPreserve] Componente registrado:', componentId, 'en', containerId);
        },
        
        // Guardar HTML antes de que ContentManager lo limpie
        saveAll: function() {
          this.components.forEach((comp, key) => {
            const container = document.getElementById(comp.containerId);
            if (container) {
              const block = container.closest('div[style*="margin-top"]') || 
                           container.closest('div[style*="padding"]') ||
                           container.parentElement ||
                           container;
              if (block) {
                comp.html = block.outerHTML;
              }
            }
          });
        },
        
        // Restaurar componentes después de ContentManager.updateContent
        restoreAll: function() {
          const contentArea = document.querySelector('.content-area');
          if (!contentArea) return;
          
          this.components.forEach((comp, key) => {
            const existing = document.getElementById(comp.containerId);
            if (!existing && comp.html) {
              // Buscar contenedor objetivo
              let target = contentArea.querySelector('.widget-contenido-principal') ||
                          contentArea.querySelector('.section-single') ||
                          contentArea.querySelector('div[class*="widget"]') ||
                          contentArea;
              
              if (target) {
                target.insertAdjacentHTML('beforeend', comp.html);
                
                // Re-agregar event listeners con selectores específicos por componente
                setTimeout(() => {
                  const restored = document.getElementById(comp.containerId);
                  if (restored && comp.handlers) {
                    // Manejar componentes específicos
                    if (comp.componentId === 'radio-button') {
                      // RadioButton: listeners en .ubits-radio-button__input
                      const inputs = restored.querySelectorAll('.ubits-radio-button__input');
                      inputs.forEach(input => {
                        if (comp.handlers.onChange || comp.handlers.change) {
                          input.addEventListener('change', comp.handlers.onChange || comp.handlers.change);
                        }
                        if (comp.handlers.onClick || comp.handlers.click) {
                          input.addEventListener('click', comp.handlers.onClick || comp.handlers.click);
                        }
                      });
                      // También agregar listeners a los labels
                      const labels = restored.querySelectorAll('.ubits-radio-button');
                      labels.forEach(label => {
                        if (comp.handlers.onLabelClick || comp.handlers.labelClick) {
                          label.addEventListener('click', comp.handlers.onLabelClick || comp.handlers.labelClick);
                        }
                      });
                    } else if (comp.componentId === 'button') {
                      // Button: listeners en .ubits-button
                      const buttons = restored.querySelectorAll('.ubits-button');
                      buttons.forEach(button => {
                        if (comp.handlers.onClick || comp.handlers.click) {
                          button.addEventListener('click', comp.handlers.onClick || comp.handlers.click);
                        }
                      });
                    } else if (comp.componentId === 'checkbox') {
                      // Checkbox: listeners en .ubits-checkbox__input
                      const inputs = restored.querySelectorAll('.ubits-checkbox__input');
                      inputs.forEach(input => {
                        if (comp.handlers.onChange || comp.handlers.change) {
                          input.addEventListener('change', comp.handlers.onChange || comp.handlers.change);
                        }
                      });
                    } else {
                      // Lógica genérica para otros componentes
                      Object.keys(comp.handlers).forEach(eventName => {
                        const normalizedEventName = eventName.replace(/^on/, '').toLowerCase();
                        const elements = restored.querySelectorAll('[data-component="' + comp.componentId + '"]');
                        if (elements.length === 0) {
                          // Si no hay elementos con data-component, buscar en todo el contenedor
                          const allElements = restored.querySelectorAll('*');
                          allElements.forEach(el => {
                            el.addEventListener(normalizedEventName, comp.handlers[eventName]);
                          });
                        } else {
                          elements.forEach(el => {
                            el.addEventListener(normalizedEventName, comp.handlers[eventName]);
                          });
                        }
                      });
                    }
                  }
                }, 100);
              }
            }
          });
        }
      };
      
      // Interceptar ContentManager.updateContent automáticamente
      if (window.UBITS_ContentManager && window.UBITS_ContentManager.updateContent) {
        const originalUpdateContent = window.UBITS_ContentManager.updateContent;
        window.UBITS_ContentManager.updateContent = function(section, subSection) {
          // Guardar componentes antes de limpiar
          window.AUTORUN_PRESERVE_COMPONENTS.saveAll();
          
          // Llamar método original
          const result = originalUpdateContent.call(this, section, subSection);
          
          // Restaurar componentes después
          setTimeout(() => {
            window.AUTORUN_PRESERVE_COMPONENTS.restoreAll();
          }, 500);
          
          return result;
        };
        console.log('✅ [AutoPreserve] ContentManager.updateContent interceptado automáticamente');
      }
    })();
  </script>
<!-- AUTORUN:ANCHOR:SCRIPTS -->
