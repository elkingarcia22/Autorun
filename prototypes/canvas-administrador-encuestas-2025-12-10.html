    <style>
        /* ========================================
           GLOBAL STYLES
           ======================================== */
        
        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--ubits-bg-2);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overflow-y: auto;
            font-family: var(--font-sans, 'Noto Sans', sans-serif);
            scrollbar-width: thin;
            scrollbar-color: var(--ubits-fg-2-medium-static) var(--ubits-bg-5);
        }

        /* Scrollbar personalizado */
        ::-webkit-scrollbar {
            width: var(--ubits-spacing-sm, 8px);
        }

        ::-webkit-scrollbar-track {
            background: var(--ubits-bg-5);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--ubits-fg-2-medium-static);
            border-radius: var(--ubits-border-radius-xs, 4px);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--ubits-fg-2-high-static);
        }

        /* ========================================
           DASHBOARD CONTAINER
           ======================================== */
        
        .dashboard-container {
            display: flex;
            min-height: 100vh;
            width: 100%;
            overflow: visible;
            /* ⚠️ IMPORTANTE: NO usar justify-content: center aquí */
            /* El margin: auto en .main-content (≥1440px) se encarga del centrado */
        }

        /* ========================================
           TOOLTIP
           ======================================== */
        
        /* ⚠️ NOTA: Los estilos del tooltip del sidebar están en el componente sidebar.css */
        /* No sobrescribir aquí, usar los estilos del componente oficial */
        
        /* Asegurar que la línea divisoria del footer del sidebar se muestre */
        .ubits-sidebar-footer {
            position: relative !important;
        }
        
        .ubits-sidebar-footer::before {
            content: '' !important;
            position: absolute !important;
            top: 0 !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            width: 32px !important;
            height: 1px !important;
            background-color: var(--ubits-fg-1-medium, #5c646f) !important;
        }
        
        [data-theme="dark"] .ubits-sidebar-footer::before {
            background-color: var(--ubits-fg-1-medium, #d0d2d5) !important;
        }

        /* ========================================
           MAIN CONTENT
           ======================================== */
        
        .main-content {
            position: relative;
            flex: 1;
            margin: var(--ubits-spacing-lg, 16px) var(--ubits-spacing-2xl, 24px) 0 calc(var(--ubits-spacing-2xl, 24px) + 96px + 23px);
            width: calc(100% - calc(var(--ubits-spacing-2xl, 24px) + 96px + 23px) - var(--ubits-spacing-2xl, 24px));
            overflow: visible;
            max-height: none;
            display: flex;
            flex-direction: column;
            gap: var(--ubits-spacing-lg, 16px); /* Gap entre SubNav, Tabs y Content Area */
            z-index: 5;
            box-sizing: border-box;
        }

        /* Centrado para pantallas grandes - EXACTAMENTE igual que el proyecto UBITS original */
        /* El proyecto UBITS original usa margin: auto sin cambiar flex */
        @media (min-width: 1440px) {
            .main-content {
                margin: var(--ubits-spacing-lg, 16px) auto 0 auto; /* ⚠️ margin auto centra el elemento */
                padding-left: calc(var(--ubits-spacing-2xl, 24px) + 96px + 23px); /* Espacio para sidebar (24px + 96px + 23px gap) */
                padding-right: var(--ubits-spacing-2xl, 24px);
                width: 1607px;
                max-width: 1607px;
                box-sizing: border-box;
                /* ⚠️ IMPORTANTE: Mantener flex: 1, igual que el proyecto UBITS original */
                /* NO cambiar a flex: none, el margin: auto funciona con flex: 1 */
            }
        }

        /* Ajustar gap en móvil cuando no hay subnav - igual que el proyecto UBITS original */
        @media (max-width: 1023px) {
            /* ⚠️ CRÍTICO: Ocultar sidebar container, igual que el proyecto UBITS original */
            #sidebar-container {
                display: none !important;
            }
            
            .main-content {
                gap: var(--ubits-spacing-xl, 20px);
                margin: var(--ubits-spacing-lg, 16px) var(--ubits-spacing-md, 12px) 0 var(--ubits-spacing-md, 12px) !important;
                width: calc(100% - var(--ubits-spacing-2xl, 24px));
                padding-left: 0;
                padding-right: 0;
                max-width: 100%;
                padding-bottom: var(--ubits-spacing-6xl, 40px); /* Espacio para el TabBar, igual que el proyecto UBITS original */
            }
            
            .content-area {
                padding-bottom: var(--ubits-spacing-6xl, 40px); /* Espacio para el TabBar, igual que el proyecto UBITS original */
            }
            
            .main-content > *:first-child {
                margin-top: calc(-1 * var(--ubits-spacing-xl, 20px));
            }
        }

        /* ========================================
           TOP NAV CONTAINER (SubNav)
           ======================================== */

        /* El SubNav debe mantener sus estilos originales del componente */
        /* Solo establecer el contenedor para que el componente SubNav funcione correctamente */
        #top-nav-container {
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        /* ========================================
           SUB NAV CONTAINER
           ======================================== */
        
        #top-nav-container {
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        /* ========================================
           TABS CONTAINER
           ======================================== */
        
        #encuestas-tabs-container {
            width: 100%;
            box-sizing: border-box;
        }

        /* ========================================
           DATATABLE - Contenedor y Estilos
           ======================================== */

        /* ========================================
           CONTENT AREA
           ======================================== */
        
        .content-area {
            background-color: transparent !important;
            border-radius: var(--ubits-border-radius-md, 12px);
            border: none !important;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            overflow: visible;
            box-sizing: border-box;
            max-height: none;
            box-shadow: none !important;
            width: 100%;
            max-width: 100%;
            gap: 0;
        }

        /* ========================================
           HEADER SECTION CONTAINER
           ======================================== */
        
        /* Estilos de header-section-container eliminados - no se usa en módulo encuestas */

        .content-area.no-background {
            background-color: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 var(--ubits-spacing-6xl, 40px) !important;
        }

        /* ========================================
           CONTENT SECTIONS (Sistema de Widgets)
           ======================================== */
        
        /* Estilos de content-sections eliminados - no se usa en módulo encuestas */

        /* ========================================
           SECTION TYPES
           ======================================== */
        
        /* Secciones de widgets - igual que el proyecto UBITS original */
        .section-single {
            display: flex;
            width: 100%;
            box-sizing: border-box;
        }

        .section-dual {
            display: flex;
            gap: var(--ubits-spacing-xl, 20px);
            width: 100%;
            box-sizing: border-box;
        }

        .section-triple {
            display: flex;
            gap: var(--ubits-spacing-xl, 20px);
            width: 100%;
            box-sizing: border-box;
        }

        .section-quad {
            display: flex;
            gap: var(--ubits-spacing-xl, 20px);
            width: 100%;
            box-sizing: border-box;
        }

        /* ========================================
           WIDGETS
           ======================================== */
        
        /* Widgets en secciones - igual que el proyecto UBITS original */
        .section-single > div,
        .section-dual > div,
        .section-triple > div,
        .section-quad > div {
            background-color: var(--ubits-bg-1);
            border: none;
            border-radius: var(--ubits-border-radius-sm, 8px);
            padding: var(--ubits-spacing-lg, 16px) !important; /* !important para sobrescribir el reset */
            width: 100%; /* Ocupar el 100% del ancho de la sección */
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            min-width: 0; /* Permitir que se reduzca si es necesario */
        }

        /* Distribución de anchos - igual que el proyecto UBITS original */
        .section-single > div {
            flex: 1;
        }

        .section-dual > div {
            flex: 1;
        }

        .section-triple > div {
            flex: 1;
        }

        .section-quad > div {
            flex: 1;
        }

        /* ========================================
           RESPONSIVE
           ======================================== */
        
        @media (max-width: 1023px) {
            /* Estilos de content-sections eliminados - no se usa en módulo encuestas */
            
            .section-dual,
            .section-triple,
            .section-quad {
                flex-direction: column;
                gap: var(--ubits-spacing-lg, 16px);
            }
        }

        @media (max-width: 480px) {
            .section-single > div,
            .section-dual > div,
            .section-triple > div,
            .section-quad > div {
                padding: var(--ubits-spacing-md, 12px) !important;
            }
        }

        /* ========================================
           DARK MODE
           ======================================== */
        
        [data-theme="dark"] body {
            background-color: var(--ubits-bg-2) !important;
        }

        [data-theme="dark"] .dashboard-container {
            background-color: var(--ubits-bg-2) !important;
        }

        [data-theme="dark"] .content-area {
            background-color: transparent !important;
            border-color: transparent !important;
        }

        body[data-theme="dark"] {
            background-color: var(--ubits-bg-2) !important;
        }

        body[data-theme="dark"] .dashboard-container {
            background-color: var(--ubits-bg-2) !important;
        }

        body[data-theme="dark"] .content-area {
            background-color: transparent !important;
            border-color: transparent !important;
        }

        /* Transiciones suaves para dark mode */
        body {
            transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *[data-theme] {
            transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        color 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        border-color 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>

  <style>
    /* Fix: Asegurar que el botón activo del sidebar sea visible en dark mode */
    body[data-theme="dark"] .ubits-sidebar-nav-button.active,
    html[data-theme="dark"] .ubits-sidebar-nav-button.active {
      background: var(--ubits-sidebar-button-bg-active, #ffffff) !important;
    }
    
    /* Asegurar que el icono del botón activo sea visible en dark mode */
    body[data-theme="dark"] .ubits-sidebar-nav-button.active i,
    html[data-theme="dark"] .ubits-sidebar-nav-button.active i {
      color: var(--ubits-sidebar-button-fg-active, #303a47) !important;
    }
    
    /* Fix: Asegurar que el indicador activo del subnav (flechita azul) sea visible */
    /* NO sobrescribir el background-color - dejar que el componente use sus propios tokens:
       - Light mode: --ubits-accent-brand-static (definido en subnav.css línea 118)
       - Dark mode: --modifiers-normal-color-dark-accent-blue (definido en subnav.css línea 128)
    */
    .ubits-sub-nav-tab.ubits-sub-nav-tab--active::after {
      content: '' !important;
      position: absolute !important;
      bottom: 0 !important;
      left: 0 !important;
      right: 0 !important;
      height: 3px !important;
      border-radius: 0 !important;
      z-index: 1 !important;
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      width: auto !important;
      /* NO sobrescribir background-color - el componente ya lo maneja correctamente */
    }
    
    /* En dark mode, solo asegurar visibilidad - el componente ya usa --modifiers-normal-color-dark-accent-blue */
    body[data-theme="dark"] .ubits-sub-nav-tab.ubits-sub-nav-tab--active::after,
    html[data-theme="dark"] .ubits-sub-nav-tab.ubits-sub-nav-tab--active::after,
    [data-theme="dark"] .ubits-sub-nav-tab.ubits-sub-nav-tab--active::after {
      opacity: 1 !important;
      visibility: visible !important;
      display: block !important;
      /* NO sobrescribir background-color - el componente ya usa --modifiers-normal-color-dark-accent-blue */
    }
    
    /* Asegurar que el contenedor del subnav permita que el indicador sea visible */
    .ubits-sub-nav-tabs {
      overflow: visible !important;
    }
    
    .ubits-sub-nav-tab {
      position: relative !important;
      overflow: visible !important;
    }
  </style>

        let menuItems = [];

            if (found.length > 0) {
              menuItems = Array.from(new Set([...menuItems, ...Array.from(found)]));

          } catch (e) {

        });

            // Actualizar href PRIMERO para que apunte al archivo correcto

            // Actualizar onclick si existe (sobrescribir completamente)

      }, { capture: true, passive: false }); // Capture phase con máxima prioridad
      
      // También interceptar en el phase de bubbling como backup
      document.addEventListener('click', function(e) {

        if (!target) return;
        
        const clickedElement = target.closest('li, button, a, div[onclick], div[role="button"], [class*="menu-item"], [class*="profile-menu"]');

            console.log('🔗 [Wizard] ✅ Redirigiendo a:', targetFileName);
            window.location.href = targetFileName;
            return false;
          }
        }
      }, { capture: false, passive: false }); // Bubbling phase como backup
    })();
  </script>

    <script>
        (function() {
            const currentModule = document.body.getAttribute('data-module');
            if (currentModule !== 'encuestas') {
                return; // Solo interceptar en módulo encuestas
            }
            
            function interceptContentManagerImmediately() {
                if (!window.UBITS_ContentManager) {
                    // Si ContentManager aún no existe, esperar
                    setTimeout(interceptContentManagerImmediately, 50);
                    return;
                }
                
                // Verificar si ya está interceptado (evitar múltiples interceptaciones)
                if (window.UBITS_ContentManager.updateContent._encuestasIntercepted) {
                    return;
                }
                
                // Guardar referencia al método original
                const originalUpdateContent = window.UBITS_ContentManager.updateContent;
                if (!originalUpdateContent) {
                    setTimeout(interceptContentManagerImmediately, 50);
                    return;
                }
                
                // Interceptar el método
                window.UBITS_ContentManager.updateContent = function(section, subSection) {
                    // ⚠️ CRÍTICO: Solo interceptar si estamos en módulo encuestas
                    const currentModule = document.body.getAttribute('data-module');
                    if (currentModule !== 'encuestas') {
                        return originalUpdateContent.call(this, section, subSection);
                    }
                    
                    console.log('🔵 [Encuestas] updateContent interceptado para sección:', section);
                    
                    // Llamar al método original (que limpia el content-area y crea HeaderSection)
                    const result = originalUpdateContent.call(this, section, subSection);
                    
                    // ⚠️ CRÍTICO: Eliminar elementos no deseados que el ContentManager crea
                    setTimeout(() => {
                        const contentArea = document.querySelector('.content-area');
                        if (!contentArea) {
                            return;
                        }
                        
                        // Eliminar HeaderSection
                        const headerContainer = contentArea.querySelector('#header-section-container');

                            console.log('🔵 [Encuestas] Eliminando HeaderSection');
                            headerContainer.remove();

                        if (headerSection) {
                            console.log('🔵 [Encuestas] Eliminando .ubits-header-section');
                            const container = headerSection.closest('#header-section-container');
                            if (container) {
                                container.remove();
                            } else {
                                headerSection.remove();
                            }
                        }
                        
                        const contentSections = contentArea.querySelector('.content-sections');
                        if (contentSections) {
                            console.log('🔵 [Encuestas] Eliminando .content-sections');
                            contentSections.remove();

                        const widgetPrincipal = contentArea.querySelector('.widget-contenido-principal');

                            widgetPrincipal.closest('.section-single')?.remove() || widgetPrincipal.remove();
                        }
                    }, 100);
                    
                    return result;
                };
                
                // Marcar como interceptado
                window.UBITS_ContentManager.updateContent._encuestasIntercepted = true;
                console.log('✅ [Encuestas] ContentManager.updateContent interceptado INMEDIATAMENTE');
            }
            
            // ⚠️ CRÍTICO: Ejecutar inmediatamente y con múltiples intentos
            interceptContentManagerImmediately();
            setTimeout(interceptContentManagerImmediately, 100);
            setTimeout(interceptContentManagerImmediately, 500);
            
            // ⚠️ CRÍTICO: MutationObserver para eliminar elementos que se crean dinámicamente
            function setupAggressiveObserver() {
                const contentArea = document.querySelector('.content-area');
                if (!contentArea) {
                    setTimeout(setupAggressiveObserver, 50);
                    return;
                }
                
                const observer = new MutationObserver((mutations) => {
                    mutations.forEach((mutation) => {
                        if (mutation.type === 'childList') {
                            mutation.addedNodes.forEach((node) => {
                                if (node.nodeType === 1) {
                                    // Eliminar HeaderSection
                                    if (node.id === 'header-section-container' || 
                                        node.classList?.contains('ubits-header-section') ||
                                        node.querySelector?.('#header-section-container') ||
                                        node.querySelector?.('.ubits-header-section')) {
                                        const headerContainer = document.getElementById('header-section-container');
                                        if (headerContainer) headerContainer.remove();
                                        
                                        const headerSection = document.querySelector('.ubits-header-section');
                                        if (headerSection) {
                                            const container = headerSection.closest('#header-section-container');
                                            if (container) {
                                                container.remove();
                                            } else {
                                                headerSection.remove();
                                            }
                                        }
                                    }
                                    
                                    // Eliminar content-sections
                                    if (node.classList?.contains('content-sections') ||
                                        node.querySelector?.('.content-sections')) {
                                        const contentSections = document.querySelector('.content-sections');
                                        if (contentSections) contentSections.remove();
                                    }
                                    
                                    // Eliminar widget-contenido-principal
                                    if (node.classList?.contains('widget-contenido-principal') ||
                                        node.querySelector?.('.widget-contenido-principal')) {
                                        const widgetPrincipal = document.querySelector('.widget-contenido-principal');
                                        if (widgetPrincipal) {
                                            widgetPrincipal.closest('.section-single')?.remove() || widgetPrincipal.remove();
                                        }
                                    }
                                }

                            // ⚠️ CRÍTICO: Verificar si el contenedor del DataTable fue eliminado
                            mutation.removedNodes.forEach((node) => {

                                        const contentArea = document.querySelector('.content-area');

                                }

                            // ⚠️ CRÍTICO: Verificar que el contenedor del DataTable siempre exista después de cualquier cambio
                            requestAnimationFrame(() => {

                                                initializeEncuestasDataTable();
                                            }
                                        }, 500);

                                }
                            });
                        }
                    });
                });
                
                observer.observe(contentArea, {
                    childList: true,
                    subtree: true
                });
                
                console.log('✅ [Encuestas] MutationObserver agresivo configurado');
            }
            
            // Configurar observer
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', setupAggressiveObserver);
            } else {
                setupAggressiveObserver();
            }
            
            setTimeout(setupAggressiveObserver, 100);
            setTimeout(setupAggressiveObserver, 500);
        })();

    <script>
        // ========================================
        // INITIALIZATION
        // Usando los componentes reales desde components-loader.js
        // ========================================
        
        // ========================================
        // HELPER FUNCTIONS (Compatibilidad)
        // ========================================
        
        // ========================================
        // DARK MODE SYNC (para Storybook)
        // ========================================
        
        function syncThemeFromParent() {
            // Si estamos en un iframe, intentar obtener el tema del parent (Storybook)
            if (window.parent && window.parent !== window) {
                try {
                    const parentBody = window.parent.document.body;
                    const parentTheme = parentBody.getAttribute('data-theme') || 'light';
                    document.body.setAttribute('data-theme', parentTheme);
                    document.documentElement.setAttribute('data-theme', parentTheme);
                    
                    // Sincronizar con ThemeManager si está disponible
                    if (window.UBITS_ThemeManager) {
                        window.UBITS_ThemeManager.setTheme(parentTheme, false);
                    }
                } catch (e) {
                    // Si hay error de CORS, usar el tema por defecto
                    console.log('⚠️ No se puede acceder al parent (CORS), usando tema light');
                }
            }
        }
        
        // Observar cambios en el tema del parent (Storybook)
        function observeParentTheme() {
            if (window.parent && window.parent !== window) {
                try {
                    // Observar cambios en el atributo data-theme del body del parent
                    const observer = new MutationObserver((mutations) => {
                        mutations.forEach((mutation) => {
                            if (mutation.type === 'attributes' && mutation.attributeName === 'data-theme') {
                                const parentTheme = window.parent.document.body.getAttribute('data-theme') || 'light';
                                document.body.setAttribute('data-theme', parentTheme);
                                document.documentElement.setAttribute('data-theme', parentTheme);
                                
                                // Sincronizar con ThemeManager si está disponible
                                if (window.UBITS_ThemeManager) {
                                    window.UBITS_ThemeManager.setTheme(parentTheme, false);
                                }
                            }
                        });
                    });
                    
                    observer.observe(window.parent.document.body, {
                        attributes: true,
                        attributeFilter: ['data-theme']
                    });
                } catch (e) {
                    // Si hay error de CORS, usar polling como fallback
                    console.log('⚠️ MutationObserver no disponible (CORS), usando polling');
                    setInterval(syncThemeFromParent, 500);
                }
            }
        }
        
        function toggleDarkMode() {
            // Solo usar si NO estamos en Storybook (iframe)
            if (window.parent && window.parent !== window) {
                // En Storybook, el toggle se maneja desde el parent
                return;
            }
            
            if (window.UBITS_ThemeManager) {
                window.UBITS_ThemeManager.toggleTheme();
            } else {
                // Fallback si ThemeManager no está disponible
                const body = document.body;
                const currentTheme = body.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                body.setAttribute('data-theme', newTheme);
                localStorage.setItem('ubits-theme', newTheme);
            }
        }

        // ========================================
        // INITIALIZATION
        // ========================================
        
        // Función para verificar si los CSS se están cargando
        function checkLoadedStylesheets() {
            console.log('🔍 [CSS Check] Verificando hojas de estilo cargadas...');
            const stylesheets = Array.from(document.styleSheets);
            console.log(`📊 [CSS Check] Total de hojas de estilo encontradas: ${stylesheets.length}`);
            
            const criticalCSS = [
                'tokens.css',
                'sidebar.css',
                'subnav.css',
                'tabbar.css',
                'button.css'
            ];
            
            criticalCSS.forEach(cssName => {

    // Función para ajustar altura dinámica
    function adjustDataTableHeight(containerId) {
      const currentModule = document.body.getAttribute('data-module');
      if (currentModule !== 'encuestas') {
        return;
      }
      
      const container = document.getElementById(containerId);
      if (!container) {
        return;
      }
      
      const dataTable = container.querySelector('.ubits-data-table');
      if (!dataTable) {
        setTimeout(() => adjustDataTableHeight(containerId), 200);
        return;
      }
      
      const scrollableContainer = container.querySelector('.ubits-data-table__scrollable-container--vertical');
      if (!scrollableContainer) {
        setTimeout(() => adjustDataTableHeight(containerId), 200);
        return;
      }
      
      const sidebarElement = document.querySelector('.ubits-sidebar');
      const sidebarRect = sidebarElement ? sidebarElement.getBoundingClientRect() : null;
      const sidebarBottom = sidebarRect ? sidebarRect.bottom : window.innerHeight - 16;
      
      const containerRect = container.getBoundingClientRect();
      const maxContainerHeight = sidebarBottom - containerRect.top;
      
      if (maxContainerHeight > 0) {
        container.style.height = `${maxContainerHeight}px`;
        container.style.maxHeight = `${maxContainerHeight}px`;
        
        requestAnimationFrame(() => {
          setTimeout(() => {
            const newContainerRect = container.getBoundingClientRect();
            const diferencia = sidebarBottom - newContainerRect.bottom;
            
            if (Math.abs(diferencia) >= 2) {
              const ajusteHeight = maxContainerHeight + diferencia;
              if (ajusteHeight > 0) {
                container.style.height = `${ajusteHeight}px`;
                container.style.maxHeight = `${ajusteHeight}px`;
              }
            }
          }, 100);
        });
      }
      
      let header = dataTable.querySelector('.ubits-data-table__header');
      if (!header) {
        header = container.querySelector('.ubits-data-table__header');
      }
      if (!header) {
        const allHeaders = dataTable.querySelectorAll('[class*="header"]');
        if (allHeaders.length > 0) {
          header = allHeaders[0];
        }
      }
      const headerHeight = header ? header.getBoundingClientRect().height : 0;
      
      const containerPaddingTop = 16;
      const availableHeightForScrollable = maxContainerHeight - headerHeight - containerPaddingTop;
      
      const tableBody = scrollableContainer.querySelector('tbody');
      const rowCount = tableBody ? tableBody.querySelectorAll('tr').length : 0;
      
      const rowHeight = 45;
      const tableHeaderHeight = 45;
      const minHeightNeeded = tableHeaderHeight + (rowCount * rowHeight);
      
      if (minHeightNeeded > availableHeightForScrollable && availableHeightForScrollable > 200) {
        scrollableContainer.style.setProperty('max-height', `${availableHeightForScrollable}px`, 'important');
        
        requestAnimationFrame(() => {
          const scrollableComputedStyle = window.getComputedStyle(scrollableContainer);
          if (scrollableComputedStyle.maxHeight !== `${availableHeightForScrollable}px`) {
            scrollableContainer.style.setProperty('max-height', `${availableHeightForScrollable}px`, 'important');
          }
        });
      } else {
        scrollableContainer.style.setProperty('max-height', 'none', 'important');
      }
      
      dataTable.style.width = '100%';
      dataTable.style.maxWidth = '100%';
      container.style.width = '100%';
      container.style.maxWidth = '100%';
    }

      encuestasData = [];
      for (let i = 1; i <= 20; i++) {
        const tipo = tipos[i % tipos.length];
        const año = 2025 + (i % 2);
        const mesIndex = (i - 1) % meses.length;
        const mesInicio = meses[mesIndex];
        const mesCierre = meses[(mesIndex + 1) % meses.length];
        const diaInicio = (i % 28) + 1;

          rowExpandable: false,
          columnReorderable: false,
          rowReorderable: false,
          showVerticalScrollbar: true,
          header: {
            title: 'Lista de encuestas',
            counter: true,
            displayedItems: encuestasData.length,
            totalItems: 206,
            primaryButton: {
              text: 'Crear encuesta',
              icon: 'plus',
              onClick: () => {
                console.log('🔵 [Encuestas] Crear encuesta');
              }
            },
            secondaryButtons: [
              {
                text: 'Crear con plantilla',
                icon: 'file-lines',
                onClick: () => {
                  console.log('🔵 [Encuestas] Crear con plantilla');
                }
              }
            ],
            searchButton: {
              placeholder: 'Buscar encuestas...',
              onChange: (value) => {
                console.log('🔵 [Encuestas] Búsqueda:', value);
              }
            },
            filterButton: {
              onClick: (event) => {
                console.log('🔵 [Encuestas] Abrir filtros');
              }
            }
          },
          emptyState: {
            noSearchResults: {
              title: 'No se encontraron resultados',
              description: 'Intenta con otros términos de búsqueda o ajusta los filtros.',
              icon: 'magnifying-glass',
              showPrimaryButton: false
            },
            noFilterResults: {
              title: 'No hay resultados con los filtros aplicados',
              description: 'Intenta ajustar los filtros o limpiarlos para ver más resultados.',
              icon: 'filter',
              actionLabel: 'Ajustar filtros',
              showPrimaryButton: true,
              onAction: () => {
                console.log('🔵 [Encuestas] Empty State: Abrir drawer de filtros');
                if (window._encuestasDataTableInstance && window._encuestasDataTableInstance.element) {
                  const headerElement = window._encuestasDataTableInstance.element.querySelector('.ubits-data-table__header');
                  if (headerElement) {
                    const filterButton = headerElement.querySelector('.ubits-data-table__header-filter-button');
                    if (filterButton) {
                      filterButton.click();
                    }
                  }
                }
              },
              secondaryActionLabel: 'Limpiar filtros',
              showSecondaryButton: true,
              onSecondaryAction: () => {
                clearFiltersWithoutDrawer();
              }
            }
          },
          onRowSelect: (rowId, rowData, selected) => {
            if (selected) {
              selectionState.selectedRowIds.add(rowId);
            } else {
              selectionState.selectedRowIds.delete(rowId);
            }
            if (selectionState.selectedRowIds.size === 0) {
              selectionState.viewSelectedActive = false;
            }
            renderActionBar(tableContainer);
          },
          onSelectAll: (selected) => {
            if (selected) {
              encuestasData.forEach((row) => selectionState.selectedRowIds.add(row.id));
            } else {
              selectionState.selectedRowIds.clear();
              selectionState.viewSelectedActive = false;
            }
            setTimeout(() => renderActionBar(tableContainer), 200);
          }
        });
        
        window._encuestasDataTableInstance = encuestasDataTableInstance;
        console.log('✅ [Encuestas] Instancia del DataTable guardada en window._encuestasDataTableInstance');
        
        encuestasDataTableInitialized = true;
        
        // Interceptar cambios en checkboxes
        tableContainer.addEventListener('change', (e) => {
          const target = e.target;
          
          if (!target || target.type !== 'checkbox') return;
          
          if (target.hasAttribute('data-column-checkbox-header')) {
            const columnId = target.getAttribute('data-column-checkbox-header');
            if (columnId === 'checkbox' || columnId === 'checkbox-2') {
              if (target.checked) {
                encuestasData.forEach((row) => selectionState.selectedRowIds.add(row.id));
              } else {
                selectionState.selectedRowIds.clear();
                selectionState.viewSelectedActive = false;
              }
              setTimeout(() => renderActionBar(container), 200);
            }
          } else {
            const rowId = target.getAttribute('data-row-id');
            if (!rowId) return;
            
            if (target.checked) {
              selectionState.selectedRowIds.add(rowId);
            } else {
              selectionState.selectedRowIds.delete(rowId);
            }
            
            if (selectionState.selectedRowIds.size === 0) {
              selectionState.viewSelectedActive = false;
            }
            
            renderActionBar(container);
          }
        }, true);
        
        // MutationObserver para preservar Action Bar
        if (!actionBarObserver) {
          actionBarObserver = new MutationObserver(() => {
            const bar = container.querySelector('.ubits-data-table__action-bar');
            if (!bar) {
              setTimeout(() => {
                renderActionBar(container);
              }, 100);
            }
          });
          actionBarObserver.observe(container, { childList: true, subtree: true });
        }
        
        // Configurar altura dinámica
        setTimeout(() => {
          adjustDataTableHeight('encuestas-table-container');
        }, 300);
        
        // Listener de resize
        let resizeTimeout;
        window.addEventListener('resize', () => {
          clearTimeout(resizeTimeout);
          resizeTimeout = setTimeout(() => {
            adjustDataTableHeight('encuestas-table-container');
          }, 200);
        });
        
        console.log('✅ [Encuestas DataTable] DataTable inicializado correctamente');
      } catch (error) {
        console.error('❌ [Encuestas DataTable] Error al crear DataTable:', error);
        encuestasDataTableInitialized = false;
      }
    }
    
    // Función para inicializar DataTable de forma segura después de que el ContentManager termine
    function safeInitializeDataTable() {
      const currentModule = document.body.getAttribute('data-module');
      if (currentModule !== 'encuestas') {
        return;
      }
      
      const contentArea = document.querySelector('.content-area');
      if (!contentArea) {
        setTimeout(safeInitializeDataTable, 200);
        return;
      }
      
      let tableContainer = contentArea.querySelector('#encuestas-table-container');
      if (!tableContainer) {
        console.log('🔵 [Encuestas DataTable] Creando contenedor...');
        tableContainer = document.createElement('div');
        tableContainer.id = 'encuestas-table-container';
        contentArea.appendChild(tableContainer);
      }
      
      // Verificar si la DataTable ya existe y está visible
      const existingDataTable = tableContainer.querySelector('.ubits-data-table');
      if (existingDataTable) {
        const isVisible = existingDataTable.offsetHeight > 0 && existingDataTable.offsetWidth > 0;
        if (isVisible) {
          console.log('✅ [Encuestas DataTable] DataTable ya existe y es visible en el contenedor');
          return;
        } else {
          console.log('⚠️ [Encuestas DataTable] DataTable existe pero no es visible, reinicializando...');
          existingDataTable.remove();
          encuestasDataTableInitialized = false;
        }
      }
      
      // Inicializar solo si no está inicializado
      if (!encuestasDataTableInitialized && typeof window.createDataTable === 'function') {
        console.log('🔵 [Encuestas DataTable] Inicializando DataTable de forma segura...');
        initializeEncuestasDataTable();
      } else if (typeof window.createDataTable !== 'function') {
        console.warn('⚠️ [Encuestas DataTable] window.createDataTable no disponible, reintentando...');
        setTimeout(safeInitializeDataTable, 200);
      }
    }
    
    // Esperar a que components-loader.js se cargue
    window.addEventListener('ubits-components-loader-ready', function() {
      console.log('✅ [Encuestas DataTable] Evento ubits-components-loader-ready recibido');
      setTimeout(safeInitializeDataTable, 500);
    });
    
    // Esperar a que data-table.umd.js se cargue
    window.addEventListener('ubits-datatable-ready', function() {
      console.log('✅ [Encuestas DataTable] Evento ubits-datatable-ready recibido');
      setTimeout(safeInitializeDataTable, 500);
    });
    
    // También intentar inicializar después de que la página cargue completamente
    if (document.readyState === 'complete') {
      setTimeout(safeInitializeDataTable, 2000);
    } else {
      window.addEventListener('load', () => {
        setTimeout(safeInitializeDataTable, 2000);
      });
    }
    
    let dataTableCheckAttempts = 0;
    const maxDataTableCheckAttempts = 50;
    const dataTableCheckInterval = setInterval(() => {
      dataTableCheckAttempts++;
      if (typeof window.createDataTable === 'function') {
        clearInterval(dataTableCheckInterval);
        console.log(`✅ [Encuestas DataTable] window.createDataTable disponible después de ${dataTableCheckAttempts} intentos`);
        initializeEncuestasDataTable();
      } else if (dataTableCheckAttempts >= maxDataTableCheckAttempts) {
        clearInterval(dataTableCheckInterval);
        console.error('❌ [Encuestas DataTable] window.createDataTable no disponible después de 15 segundos');
      }
    }, 300);
    
    if (document.readyState === 'complete') {
      setTimeout(() => {
        if (typeof window.createDataTable === 'function') {
          initializeEncuestasDataTable();
        }
      }, 1000);
    } else {
      window.addEventListener('load', () => {
        setTimeout(() => {
          if (typeof window.createDataTable === 'function') {
            initializeEncuestasDataTable();
          }
        }, 1000);
      });
    }
  </script>
  
  <script>
    if (!originalHandleSectionChange) {
      // Si ContentManager aún no existe, interceptarlo cuando se cree
      Object.defineProperty(window, 'UBITS_ContentManager', {
        set: function(value) {
          console.log('🔍 [Wizard] UBITS_ContentManager definido');
          if (value && value.handleSectionChange) {
            const original = value.handleSectionChange;
            value.handleSectionChange = function(section, activeTabId) {
              console.log('🔍 [Wizard] ════════════════════════════════════════');
              console.log('🔍 [Wizard] 🔄 handleSectionChange INTERCEPTADO (desde setter)');
              console.log('🔍 [Wizard] section:', section);
              console.log('🔍 [Wizard] activeTabId:', activeTabId);
              console.log('🔍 [Wizard] currentSection antes:', this.currentSection);
              return original.call(this, section, activeTabId);
            };
          }
          Object.defineProperty(window, 'UBITS_ContentManager', { value, writable: true, configurable: true });
        },
        get: function() {
          return window._UBITS_ContentManager;
        },
        configurable: true
      });
    }
  </script>

  <script>
    // Desactivar navegación de otros módulos en el sidebar
    (function() {
      const currentModule = 'encuestas';
      
      function disableOtherModules() {
        const sidebar = document.querySelector('.ubits-sidebar');
        if (!sidebar) {
          // Si el sidebar aún no está cargado, reintentar
          setTimeout(disableOtherModules, 100);
          return;
        }
        
        // Buscar todos los botones del sidebar
        const allButtons = sidebar.querySelectorAll('.ubits-sidebar-nav-button');
        let disabledCount = 0;
        
        allButtons.forEach(button => {
          const buttonModule = button.getAttribute('data-section');
          
          // Si el botón NO es del módulo actual, deshabilitarlo
          if (buttonModule && buttonModule !== currentModule) {
            // Remover el atributo data-section para que no funcione el click
            button.removeAttribute('data-section');
            
            // Deshabilitar el botón visualmente
            button.style.opacity = '0.5';
            button.style.cursor = 'not-allowed';
            button.style.pointerEvents = 'none';
            
            // Prevenir cualquier click
            button.addEventListener('click', function(e) {
              e.preventDefault();
              e.stopPropagation();
              return false;
            }, true);
            
            disabledCount++;
          }
        });
        
        // Desactivar el logo de UBITS que lleva al inicio
        const logoElements = sidebar.querySelectorAll('a[href*="inicio"], .ubits-sidebar-logo, .ubits-logo, [data-section="inicio"]');
        logoElements.forEach(logo => {
          // Remover atributos de navegación
          logo.removeAttribute('href');
          logo.removeAttribute('data-section');
          
          // Deshabilitar visualmente
          logo.style.opacity = '0.5';
          logo.style.cursor = 'not-allowed';
          logo.style.pointerEvents = 'none';
          
          // Prevenir cualquier click
          logo.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }, true);
          
          disabledCount++;
        });
        
        // También buscar el logo por su posición común (primer elemento del sidebar)
        const sidebarHeader = sidebar.querySelector('.ubits-sidebar-header, .sidebar-header, [class*="header"]');
        if (sidebarHeader) {
          const headerLinks = sidebarHeader.querySelectorAll('a');
          headerLinks.forEach(link => {
            // Si el enlace apunta al inicio o no tiene data-section específico, desactivarlo
            const href = link.getAttribute('href') || '';
            const dataSection = link.getAttribute('data-section') || '';
            if (href.includes('inicio') || dataSection === 'inicio' || (!dataSection && href !== '#')) {
              link.removeAttribute('href');
              link.removeAttribute('data-section');
              link.style.opacity = '0.5';
              link.style.cursor = 'not-allowed';
              link.style.pointerEvents = 'none';
              link.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                return false;
              }, true);
              disabledCount++;
            }
          });
        }
        
        if (disabledCount > 0) {
          console.log('🔒 [Navegación] Desactivados ' + disabledCount + ' elemento(s) del sidebar (módulos + logo)');
        }
      }
      
      // Ejecutar cuando el DOM esté listo
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', disableOtherModules);
      } else {
        disableOtherModules();
      }
      
      // También ejecutar después de que el sidebar se cargue dinámicamente
      setTimeout(disableOtherModules, 500);
      setTimeout(disableOtherModules, 1000);
      setTimeout(disableOtherModules, 2000);
      
      // Observar cambios en el DOM para cuando el sidebar se cargue
      const observer = new MutationObserver((mutations) => {
        let shouldDisable = false;
        mutations.forEach((mutation) => {
          if (mutation.addedNodes.length > 0) {
            mutation.addedNodes.forEach((node) => {
              if (node.nodeType === 1 && 
                  (node.classList?.contains('ubits-sidebar') || 
                   node.querySelector?.('.ubits-sidebar-nav-button'))) {
                shouldDisable = true;
              }
            });
          }
        });
        if (shouldDisable) {
          setTimeout(disableOtherModules, 100);
        }
      });
      
      observer.observe(document.body, {
        childList: true,
        subtree: true
      });
    })();
  </script>
