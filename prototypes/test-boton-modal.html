<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botón que Abre Modal - Test</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            padding: 40px;
            background: #f5f5f5;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        h1 {
            margin-bottom: 30px;
            color: #333;
        }
        
        #button-container {
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test: Botón que Abre Modal</h1>
        <div id="button-container"></div>
        <div id="modal-container"></div>
    </div>

    <script>
        // ✅ Implementación generada por Autorun
        // Componentes: Button, Modal
        
        function initButton() {
            const container = document.getElementById('button-container');
            if (!container) {
                console.warn('⚠️ [Button] Contenedor no encontrado');
                return;
            }
            
            if (container.innerHTML.trim() !== '') {
                return;
            }
            
            try {
                // Crear botón usando estructura exacta de Storybook
                const button = document.createElement('button');
                button.className = 'ubits-button ubits-button--md ubits-button--primary';
                button.type = 'button';
                button.textContent = 'Abrir Modal';
                
                // Agregar evento para abrir modal
                button.addEventListener('click', () => {
                    openModal();
                });
                
                container.appendChild(button);
                console.log('✅ [Button] Botón creado correctamente');
            } catch (error) {
                console.error('❌ [Button] Error al crear botón:', error);
            }
        }
        
        let modalInstance = null;
        
        function initModal() {
            const container = document.getElementById('modal-container');
            if (!container) {
                console.warn('⚠️ [Modal] Contenedor no encontrado');
                return;
            }
            
            if (container.innerHTML.trim() !== '') {
                return;
            }
            
            try {
                // Crear estructura del modal según Storybook
                const modalWrapper = document.createElement('div');
                modalWrapper.className = 'ubits-modal-wrapper';
                modalWrapper.style.display = 'none';
                modalWrapper.id = 'modal-wrapper';
                
                // Overlay
                const overlay = document.createElement('div');
                overlay.className = 'ubits-modal-overlay';
                overlay.addEventListener('click', () => {
                    closeModal();
                });
                
                // Modal
                const modal = document.createElement('div');
                modal.className = 'ubits-modal ubits-modal--md';
                modal.setAttribute('role', 'dialog');
                modal.setAttribute('aria-labelledby', 'modal-title');
                modal.setAttribute('aria-modal', 'true');
                
                // Header
                const header = document.createElement('div');
                header.className = 'ubits-modal-header';
                
                const title = document.createElement('h2');
                title.className = 'ubits-modal-title';
                title.id = 'modal-title';
                title.textContent = 'Confirmar acción';
                
                const closeButton = document.createElement('button');
                closeButton.className = 'ubits-modal-close';
                closeButton.setAttribute('aria-label', 'Cerrar');
                closeButton.innerHTML = '<i class="fas fa-times"></i>';
                closeButton.addEventListener('click', () => {
                    closeModal();
                });
                
                header.appendChild(title);
                header.appendChild(closeButton);
                
                // Body
                const body = document.createElement('div');
                body.className = 'ubits-modal-body';
                body.innerHTML = '<p>¿Estás seguro de que deseas continuar?</p>';
                
                // Footer
                const footer = document.createElement('div');
                footer.className = 'ubits-modal-footer';
                
                const cancelButton = document.createElement('button');
                cancelButton.className = 'ubits-button ubits-button--md ubits-button--tertiary';
                cancelButton.textContent = 'Cancelar';
                cancelButton.addEventListener('click', () => {
                    closeModal();
                });
                
                const confirmButton = document.createElement('button');
                confirmButton.className = 'ubits-button ubits-button--md ubits-button--primary';
                confirmButton.textContent = 'Confirmar';
                confirmButton.addEventListener('click', () => {
                    alert('Acción confirmada!');
                    closeModal();
                });
                
                footer.appendChild(cancelButton);
                footer.appendChild(confirmButton);
                
                modal.appendChild(header);
                modal.appendChild(body);
                modal.appendChild(footer);
                
                modalWrapper.appendChild(overlay);
                modalWrapper.appendChild(modal);
                
                container.appendChild(modalWrapper);
                modalInstance = modalWrapper;
                
                console.log('✅ [Modal] Modal creado correctamente');
            } catch (error) {
                console.error('❌ [Modal] Error al crear modal:', error);
            }
        }
        
        function openModal() {
            if (modalInstance) {
                modalInstance.style.display = 'block';
                document.body.style.overflow = 'hidden';
                console.log('✅ [Modal] Modal abierto');
            }
        }
        
        function closeModal() {
            if (modalInstance) {
                modalInstance.style.display = 'none';
                document.body.style.overflow = '';
                console.log('✅ [Modal] Modal cerrado');
            }
        }
        
        // Inicializar cuando el DOM esté listo
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                initButton();
                initModal();
            });
        } else {
            initButton();
            initModal();
        }
    </script>
</body>
</html>
